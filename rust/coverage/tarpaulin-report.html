butes: HashMap::new(),\n        }\n    }\n\n    /// End the span.\n    pub fn end(\u0026mut self, success: bool) {\n        self.end_time = Some(SystemTime::now());\n        self.success = success;\n    }\n\n    /// Add an attribute to the span.\n    pub fn add_attribute(\u0026mut self, key: \u0026str, value: \u0026str) {\n        self.attributes.insert(key.to_string(), value.to_string());\n    }\n\n    /// Get the duration of the span.\n    pub fn duration(\u0026self) -\u003e Option\u003cDuration\u003e {\n        self.end_time\n            .map(|end| end.duration_since(self.start_time).unwrap_or_default())\n    }\n}\n\n/// Trace represents a collection of spans that form a single operation.\n#[derive(Debug, Clone)]\npub struct Trace {\n    /// Unique ID for this trace.\n    pub id: String,\n    /// Name of the trace.\n    pub name: String,\n    /// Start time of the trace.\n    pub start_time: SystemTime,\n    /// End time of the trace, if completed.\n    pub end_time: Option\u003cSystemTime\u003e,\n    /// Spans that make up this trace.\n    pub spans: Vec\u003cSpan\u003e,\n}\n\nimpl Trace {\n    /// Create a new trace.\n    pub fn new(name: \u0026str) -\u003e Self {\n        Self {\n            id: Uuid::new_v4().to_string(),\n            name: name.to_string(),\n            start_time: SystemTime::now(),\n            end_time: None,\n            spans: Vec::new(),\n        }\n    }\n\n    /// End the trace.\n    pub fn end(\u0026mut self) {\n        self.end_time = Some(SystemTime::now());\n    }\n\n    /// Add a span to the trace.\n    pub fn add_span(\u0026mut self, span: Span) {\n        self.spans.push(span);\n    }\n\n    /// Get the duration of the trace.\n    pub fn duration(\u0026self) -\u003e Option\u003cDuration\u003e {\n        self.end_time\n            .map(|end| end.duration_since(self.start_time).unwrap_or_default())\n    }\n}\n\n/// Tracer collects and manages traces.\npub struct Tracer {\n    /// Active traces.\n    traces: RwLock\u003cHashMap\u003cString, Trace\u003e\u003e,\n    /// Current span for each trace.\n    current_spans: RwLock\u003cHashMap\u003cString, Span\u003e\u003e,\n    /// Service name.\n    service_name: String,\n}\n\nimpl Tracer {\n    /// Create a new tracer.\n    pub fn new(service_name: \u0026str) -\u003e Self {\n        Self {\n            traces: RwLock::new(HashMap::new()),\n            current_spans: RwLock::new(HashMap::new()),\n            service_name: service_name.to_string(),\n        }\n    }\n\n    /// Start a new trace.\n    pub fn start_trace(\u0026self, name: \u0026str) -\u003e String {\n        let trace = Trace::new(name);\n        let trace_id = trace.id.clone();\n\n        let mut traces = self.traces.write().unwrap();\n        traces.insert(trace_id.clone(), trace);\n\n        trace_id\n    }\n\n    /// End a trace.\n    pub fn end_trace(\u0026self, trace_id: \u0026str) {\n        let mut traces = self.traces.write().unwrap();\n        if let Some(trace) = traces.get_mut(trace_id) {\n            trace.end();\n        }\n    }\n\n    /// Start a new span.\n    pub fn start_span(\u0026self, name: \u0026str, trace_id: \u0026str, parent_id: Option\u003c\u0026str\u003e) -\u003e String {\n        let span = Span::new(name, trace_id, parent_id);\n        let span_id = span.id.clone();\n\n        // Add the span to the trace\n        let mut traces = self.traces.write().unwrap();\n        if let Some(trace) = traces.get_mut(trace_id) {\n            trace.add_span(span.clone());\n        }\n\n        // Set as current span for the trace\n        let mut current_spans = self.current_spans.write().unwrap();\n        current_spans.insert(trace_id.to_string(), span);\n\n        span_id\n    }\n\n    /// End a span.\n    pub fn end_span(\u0026self, trace_id: \u0026str, success: bool) {\n        // Get the current span for the trace\n        let mut current_spans = self.current_spans.write().unwrap();\n        if let Some(span) = current_spans.get_mut(trace_id) {\n            span.end(success);\n        }\n    }\n\n    /// Add an attribute to the current span.\n    pub fn add_attribute(\u0026self, trace_id: \u0026str, key: \u0026str, value: \u0026str) {\n        let mut current_spans = self.current_spans.write().unwrap();\n        if let Some(span) = current_spans.get_mut(trace_id) {\n            span.add_attribute(key, value);\n        }\n    }\n\n    /// Get a trace by ID.\n    pub fn get_trace(\u0026self, trace_id: \u0026str) -\u003e Option\u003cTrace\u003e {\n        let traces = self.traces.read().unwrap();\n        traces.get(trace_id).cloned()\n    }\n\n    /// Get all traces.\n    pub fn get_traces(\u0026self) -\u003e Vec\u003cTrace\u003e {\n        let traces = self.traces.read().unwrap();\n        traces.values().cloned().collect()\n    }\n}\n\n/// TracingMiddleware is a middleware that adds tracing to HybridPipe operations.\npub struct TracingMiddleware {\n    /// The tracer to use.\n    tracer: Arc\u003cTracer\u003e,\n    /// The current trace ID.\n    current_trace_id: Mutex\u003cOption\u003cString\u003e\u003e,\n}\n\nimpl TracingMiddleware {\n    /// Create a new tracing middleware.\n    pub fn new(tracer: Arc\u003cTracer\u003e) -\u003e Self {\n        Self {\n            tracer,\n            current_trace_id: Mutex::new(None),\n        }\n    }\n\n    /// Start a new trace.\n    pub fn start_trace(\u0026self, name: \u0026str) -\u003e String {\n        let trace_id = self.tracer.start_trace(name);\n        let mut current_trace_id = self.current_trace_id.lock().unwrap();\n        *current_trace_id = Some(trace_id.clone());\n        trace_id\n    }\n\n    /// End the current trace.\n    pub fn end_trace(\u0026self) {\n        let current_trace_id = self.current_trace_id.lock().unwrap();\n        if let Some(trace_id) = current_trace_id.as_ref() {\n            self.tracer.end_trace(trace_id);\n        }\n    }\n}\n\n#[async_trait]\nimpl Middleware for TracingMiddleware {\n    fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n        // This middleware doesn't wrap a HybridPipe directly\n        panic!(\"TracingMiddleware doesn't wrap a HybridPipe directly\");\n    }\n\n    async fn before_dispatch(\u0026self, pipe: \u0026str, _data: \u0026Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        let current_trace_id = self.current_trace_id.lock().unwrap();\n        if let Some(trace_id) = current_trace_id.as_ref() {\n            let _span_id = self\n                .tracer\n                .start_span(\u0026format!(\"dispatch:{}\", pipe), trace_id, None);\n            self.tracer.add_attribute(trace_id, \"pipe\", pipe);\n        }\n        Ok(())\n    }\n\n    async fn after_dispatch(\n        \u0026self,\n        _pipe: \u0026str,\n        _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        result: \u0026Result\u003c()\u003e,\n    ) {\n        let current_trace_id = self.current_trace_id.lock().unwrap();\n        if let Some(trace_id) = current_trace_id.as_ref() {\n            self.tracer.end_span(trace_id, result.is_ok());\n        }\n    }\n\n    async fn before_process(\u0026self, pipe: \u0026str, data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        let current_trace_id = self.current_trace_id.lock().unwrap();\n        if let Some(trace_id) = current_trace_id.as_ref() {\n            let _span_id = self\n                .tracer\n                .start_span(\u0026format!(\"process:{}\", pipe), trace_id, None);\n            self.tracer.add_attribute(trace_id, \"pipe\", pipe);\n            self.tracer\n                .add_attribute(trace_id, \"size\", \u0026data.len().to_string());\n        }\n        Ok(())\n    }\n\n    async fn after_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8], result: \u0026Result\u003c()\u003e) {\n        let current_trace_id = self.current_trace_id.lock().unwrap();\n        if let Some(trace_id) = current_trace_id.as_ref() {\n            self.tracer.end_span(trace_id, result.is_ok());\n        }\n    }\n}\n","traces":[{         assert_eq!(span.name, name, \"Span name should match\");\n        assert_eq!(span.trace_id, trace_id, \"Trace ID should match\");\n        assert_eq!(\n            span.parent_id,\n            Some(\"parent-span\".to_string()),\n            \"Parent ID should match\"\n        );\n        assert!(span.id.len() \u003e 0, \"Span ID should be generated\");\n        assert!(span.attributes.is_empty(), \"Attributes should be empty\");\n        assert_eq!(span.success, false, \"Success should be false\");\n        assert!(span.end_time.is_none(), \"End time should be None\");\n    }\n\n    #[test]\n    fn test_span_end() {\n        let span_name = \"test-span\";\n        let trace_id = \"test-trace\";\n        let mut span = Span::new(span_name, trace_id, None);\n\n        // End the span\n        span.end(true);\n\n        assert!(span.end_time.is_some(), \"End time should be set\");\n        assert_eq!(span.success, true, \"Success should be true\");\n\n        // Test with failure\n        let mut span = Span::new(span_name, trace_id, None);\n        span.end(false);\n\n        assert!(span.end_time.is_some(), \"End time should be set\");\n        assert_eq!(span.success, false, \"Success should be false\");\n    }\n\n    #[test]\n    fn test_span_add_attribute() {\n        let span_name = \"test-span\";\n        let trace_id = \"test-trace\";\n        let mut span = Span::new(span_name, trace_id, None);\n\n        // Add an attribute\n        span.add_attribute(\"key1\", \"value1\");\n\n        assert_eq!(span.attributes.len(), 1, \"Attributes should have one entry\");\n        assert_eq!(\n            span.attributes.get(\"key1\"),\n            Some(\u0026\"value1\".to_string()),\n            \"Attribute value should match\"\n        );\n\n        // Add another attribute\n        span.add_attribute(\"key2\", \"value2\");\n\n        assert_eq!(\n            span.attributes.len(),\n            2,\n            \"Attributes should have two entries\"\n        );\n        assert_eq!(\n            span.attributes.get(\"key2\"),\n            Some(\u0026\"value2\".to_string()),\n            \"Attribute value should match\"\n        );\n\n        // Override an attribute\n        span.add_attribute(\"key1\", \"new-value\");\n\n        assert_eq!(\n            span.attributes.len(),\n            2,\n            \"Attributes should still have two entries\"\n        );\n        assert_eq!(\n            span.attributes.get(\"key1\"),\n            Some(\u0026\"new-value\".to_string()),\n            \"Attribute value should be updated\"\n        );\n    }\n\n    #[test]\n    fn test_span_duration() {\n        let span_name = \"test-span\";\n        let trace_id = \"test-trace\";\n        let mut span = Span::new(span_name, trace_id, None);\n\n        // Duration should be None for a span that hasn't ended\n        assert!(\n            span.duration().is_none(),\n            \"Duration should be None for a span that hasn't ended\"\n        );\n\n        // Wait a bit\n        sleep(Duration::from_millis(10));\n\n        // End the span\n        span.end(true);\n\n        // Duration should be Some for a span that has ended\n        assert!(\n            span.duration().is_some(),\n            \"Duration should be Some for a span that has ended\"\n        );\n        assert!(\n            span.duration().unwrap() \u003e= Duration::from_millis(10),\n            \"Duration should be at least 10ms\"\n        );\n    }\n\n    #[test]\n    fn test_trace_new() {\n        let trace_name = \"test-trace\";\n\n        let trace = Trace::new(trace_name);\n\n        assert_eq!(trace.name, trace_name, \"Trace name should match\");\n        assert!(trace.id.len() \u003e 0, \"Trace ID should be generated\");\n        assert!(trace.spans.is_empty(), \"Spans should be empty\");\n        assert!(trace.end_time.is_none(), \"End time should be None\");\n    }\n\n    #[test]\n    fn test_trace_end() {\n        let trace_name = \"test-trace\";\n        let mut trace = Trace::new(trace_name);\n\n        // End the trace\n        trace.end();\n\n        assert!(trace.end_time.is_some(), \"End time should be set\");\n    }\n\n    #[test]\n    fn test_trace_add_span() {\n        let trace_name = \"test-trace\";\n        let mut trace = Trace::new(trace_name);\n\n        // Create a span\n        let span = Span::new(\"test-span\", \u0026trace.id, None);\n\n        // Add the span to the trace\n        trace.add_span(span);\n\n        assert_eq!(trace.spans.len(), 1, \"Trace should have one span\");\n        assert_eq!(trace.spans[0].name, \"test-span\", \"Span name should match\");\n\n        // Add another span\n        let span2 = Span::new(\"test-span-2\", \u0026trace.id, Some(\u0026trace.spans[0].id));\n        trace.add_span(span2);\n\n        assert_eq!(trace.spans.len(), 2, \"Trace should have two spans\");\n        assert_eq!(trace.spans[1].name, \"test-span-2\", \"Span name should match\");\n        assert_eq!(\n            trace.spans[1].parent_id,\n            Some(trace.spans[0].id.clone()),\n            \"Parent ID should match\"\n        );\n    }\n\n    #[test]\n    fn test_trace_duration() {\n        let trace_name = \"test-trace\";\n        let mut trace = Trace::new(trace_name);\n\n        // Duration should be None for a trace that hasn't ended\n        assert!(\n            trace.duration().is_none(),\n            \"Duration should be None for a trace that hasn't ended\"\n        );\n\n        // Wait a bit\n        sleep(Duration::from_millis(10));\n\n        // End the trace\n        trace.end();\n\n        // Duration should be Some for a trace that has ended\n        assert!(\n            trace.duration().is_some(),\n            \"Duration should be Some for a trace that has ended\"\n        );\n        assert!(\n            trace.duration().unwrap() \u003e= Duration::from_millis(10),\n            \"Duration should be at least 10ms\"\n        );\n    }\n\n    #[test]\n    fn test_tracer_new() {\n            let _: TestMessage = decode_with_options(black_box(\u0026encoded_compressed), black_box(\u0026options_compressed)).unwrap();\n        })\n    });\n}\n\ncriterion_group!(\n    benches,\n    bench_bincode_serialization,\n    bench_json_serialization,\n    bench_messagepack_serialization,\n    bench_compression,\n);\ncriterion_main!(benches);\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","examples","comprehensive_example.rs"],"content":"use hybridpipe::{\n    deploy_router, init, BrokerType, HybridPipe, LoggingMiddleware, MiddlewareStack,\n    MonitoringMiddleware, Tracer, TracingMiddleware, new_message_stats,\n};\nuse serde::{Serialize, Deserialize};\nuse std::sync::Arc;\nuse tokio::signal;\nuse tokio::time::{sleep, Duration};\nuse log::{info, error};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct Person {\n    name: String,\n    age: u32,\n    next_gen: Vec\u003cString\u003e,\n    c_age: Vec\u003cu32\u003e,\n}\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct StatusUpdate {\n    status: String,\n    timestamp: u64,\n    source: String,\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    // Initialize logging\n    env_logger::init();\n    \n    // Initialize HybridPipe\n    init();\n    \n    info!(\"Starting HybridPipe Comprehensive Example\");\n    \n    // Create monitoring and tracing components\n    let stats = new_message_stats();\n    let tracer = Arc::new(Tracer::new(\"comprehensive-example\"));\n    \n    // Create middleware\n    let monitoring_middleware = MonitoringMiddleware::new(stats.clone());\n    let logging_middleware = LoggingMiddleware::new();\n    let tracing_middleware = TracingMiddleware::new(tracer.clone());\n    \n    // Deploy a mock router for testing\n    let router = deploy_router(BrokerType::MOCK)?;\n    \n    // Create a middleware stack\n    let mut middleware_stack = MiddlewareStack::new(router);\n    middleware_stack.add_middleware(monitoring_middleware);\n    middleware_stack.add_middleware(logging_middleware);\n    middleware_stack.add_middleware(tracing_middleware);\n    \n    // Connect to the messaging system\n    middleware_stack.connect().await?;\n    info!(\"Connected to mock messaging system\");\n    \n    // Start a trace\n    let trace_id = tracer.start_trace(\"comprehensive-example\");\n    \n    // Subscribe to person updates\n    middleware_stack.accept(\"app.users.events\", |data| {\n        if let Some(person) = data.downcast_ref::\u003cPerson\u003e() {\n            info!(\"Received person: {}, age: {}\", person.name, person.age);\n            info!(\"Next generation: {:?}\", person.next_gen);\n            info!(\"Next generation ages: {:?}\", person.c_age);\n        } else {\n            error!(\"Received data of unknown type on app.users.events\");\n        }\n    }).await?;\n    info!(\"Subscribed to pipe: app.users.events\");\n    \n    // Subscribe to status updates\n    middleware_stack.accept(\"app.status.events\", |data| {\n        if let Some(status) = data.downcast_ref::\u003cStatusUpdate\u003e() {\n            info!(\"Received status update: {} from {} at {}\", status.status, status.source, status.timestamp);\n        } else {\n            error!(\"Received data of unknown type on app.status.events\");\n        }\n    }).await?;\n    info!(\"Subscribed to pipe: app.status.events\");\n    \n    // Create and send a person message\n    let person = Person {\n        name: \"David Gower\".to_string(),\n        age: 75,\n        next_gen: vec![\"Pringle\".to_string(), \"NH Fairbrother\".to_string(), \"Wasim\".to_string()],\n        c_age: vec![45, 37, 39],\n    };\n    \n    middleware_stack.dispatch(\"app.users.events\", Box::new(person)).await?;\n    info!(\"Sent person message to pipe: app.users.events\");\n    \n    // Create and send a status update\n    let status = StatusUpdate {\n        status: \"Online\".to_string(),\n        timestamp: std::time::SystemTime::now()\n            .duration_since(std::time::UNIX_EPOCH)\n            .unwrap()\n            .as_secs(),\n        source: \"HybridPipe Example\".to_string(),\n    };\n    \n    middleware_stack.dispatch(\"app.status.events\", Box::new(status)).await?;\n    info!(\"Sent status update to pipe: app.status.events\");\n    \n    // Wait a bit to see the output\n    sleep(Duration::from_secs(1)).await;\n    \n    // Print monitoring stats\n    let dispatch_metrics = stats.get_dispatch_metrics();\n    info!(\"Dispatch metrics:\");\n    for (pipe, metrics) in dispatch_metrics {\n        info!(\"  Pipe: {}\", pipe);\n        info!(\"    Total: {}\", metrics.total_count);\n        info!(\"    Success: {}\", metrics.success_count);\n        info!(\"    Error: {}\", metrics.error_count);\n        if let Some(min_time) = metrics.min_time {\n            info!(\"    Min time: {:?}\", min_time);\n        }\n        if let Some(max_time) = metrics.max_time {\n            info!(\"    Max time: {:?}\", max_time);\n        }\n    }\n    \n    let process_metrics = stats.get_process_metrics();\n    info!(\"Process metrics:\");\n    for (pipe, metrics) in process_metrics {\n        info!(\"  Pipe: {}\", pipe);\n        info!(\"    Total: {}\", metrics.total_count);\n        info!(\"    Success: {}\", metrics.success_count);\n        info!(\"    Error: {}\", metrics.error_count);\n        info!(\"    Total size: {} bytes\", metrics.total_size);\n        if let Some(min_time) = metrics.min_time {\n            info!(\"    Min time: {:?}\", min_time);\n        }\n        if let Some(max_time) = metrics.max_time {\n            info!(\"    Max time: {:?}\", max_time);\n        }\n    }\n    \n    // Print trace information\n    let trace = tracer.get_trace(\u0026trace_id).unwrap();\n    info!(\"Trace: {}\", trace.name);\n    info!(\"  ID: {}\", trace.id);\n    info!(\"  Start time: {:?}\", trace.start_time);\n    info!(\"  Spans: {}\", trace.spans.len());\n    for span in \u0026trace.spans {\n        info!(\"    Span: {}\", span.name);\n        info!(\"      ID: {}\", span.id);\n        info!(\"      Start time: {:?}\", span.start_time);\n        if let Some(end_time) = span.end_time {\n            info!(\"      End time: {:?}\", end_time);\n        }\n        info!(\"      Success: {}\", span.success);\n        if !span.attributes.is_empty() {\n            info!(\"      Attributes:\");\n            for (key, value) in \u0026span.attributes {\n                info!(\"        {}: {}\", key, value);\n            }\n        }\n    }\n    \n    // End the trace\n    tracer.end_trace(\u0026trace_id);\n    \n    // Clean up\n    middleware_stack.disconnect().await?;\n    info!(\"Disconnected from mock messaging system\");\n    \n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","examples","kafka_example.rs"],"content":"use hybridpipe::{deploy_router, BrokerType};\nuse serde::{Serialize, Deserialize};\nuse std::sync::Arc;\nuse tokio::signal;\nuse log::{info, error};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct Person {\n    name: String,\n    age: u32,\n    next_gen: Vec\u003cString\u003e,\n    c_age: Vec\u003cu32\u003e,\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    // Initialize logging\n    env_logger::init();\n    \n    info!(\"Starting HybridPipe Kafka Example\");\n    \n    // Connect to Kafka\n    let router = deploy_router(BrokerType::KAFKA)?;\n    router.connect().await?;\n    info!(\"Connected to Kafka\");\n    \n    // Create a message\n    let person = Person {\n        name: \"David Gower\".to_string(),\n        age: 75,\n        next_gen: vec![\"Pringle\".to_string(), \"NH Fairbrother\".to_string(), \"Wasim\".to_string()],\n        c_age: vec![45, 37, 39],\n    };\n    \n    // Subscribe to a pipe\n    router.accept(\"app.users.events\", |data| {\n        if let Some(person) = data.downcast_ref::\u003cPerson\u003e() {\n            info!(\"Received person: {}, age: {}\", person.name, person.age);\n            info!(\"Next generation: {:?}\", person.next_gen);\n            info!(\"Next generation ages: {:?}\", person.c_age);\n        } else {\n            error!(\"Received data of unknown type\");\n        }\n    }).await?;\n    info!(\"Subscribed to pipe: app.users.events\");\n    \n    // Send the message\n    router.dispatch(\"app.users.events\", Box::new(person)).await?;\n    info!(\"Sent message to pipe: app.users.events\");\n    \n    // Wait for Ctrl+C\n    info!(\"Press Ctrl+C to exit\");\n    signal::ctrl_c().await?;\n    \n    // Clean up\n    router.disconnect().await?;\n    info!(\"Disconnected from Kafka\");\n    \n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","examples","mock_example.rs"],"content":"use hybridpipe::{deploy_router, BrokerType};\nuse serde::{Serialize, Deserialize};\nuse std::sync::Arc;\nuse tokio::signal;\nuse tokio::time::{sleep, Duration};\nuse log::{info, error};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct Person {\n    name: String,\n    age: u32,\n    next_gen: Vec\u003cString\u003e,\n    c_age: Vec\u003cu32\u003e,\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    // Initialize logging\n    env_logger::init();\n    \n    info!(\"Starting HybridPipe Mock Example\");\n    \n    // Connect to the mock messaging system\n    let router = deploy_router(BrokerType::MOCK)?;\n    router.connect().await?;\n    info!(\"Connected to mock messaging system\");\n    \n    // Create a message\n    let person = Person {\n        name: \"David Gower\".to_string(),\n        age: 75,\n        next_gen: vec![\"Pringle\".to_string(), \"NH Fairbrother\".to_string(), \"Wasim\ r\u003c'_\u003e) -\u003e fmt::Result {\n        match self {\n            BrokerType::NATS =\u003e write!(f, \"NATS\"),\n            BrokerType::KAFKA =\u003e write!(f, \"KAFKA\"),\n            BrokerType::RABBITMQ =\u003e write!(f, \"RABBITMQ\"),\n            BrokerType::RESERVED1 =\u003e write!(f, \"RESERVED1\"),\n            BrokerType::AMQP1 =\u003e write!(f, \"AMQP1\"),\n            BrokerType::MQTT =\u003e write!(f, \"MQTT\"),\n            BrokerType::QPID =\u003e write!(f, \"QPID\"),\n            BrokerType::NSQ =\u003e write!(f, \"NSQ\"),\n            BrokerType::TCP =\u003e write!(f, \"TCP\"),\n            BrokerType::REDIS =\u003e write!(f, \"REDIS\"),\n            BrokerType::NETCHAN =\u003e write!(f, \"NETCHAN\"),\n            BrokerType::MOCK =\u003e write!(f, \"MOCK\"),\n        }\n    }\n}\n\n// Constants for broker types\npub const NATS: BrokerType = BrokerType::NATS;\npub const KAFKA: BrokerType = BrokerType::KAFKA;\npub const RABBITMQ: BrokerType = BrokerType::RABBITMQ;\npub const RESERVED1: BrokerType = BrokerType::RESERVED1;\npub const AMQP1: BrokerType = BrokerType::AMQP1;\npub const MQTT: BrokerType = BrokerType::MQTT;\npub const QPID: BrokerType = BrokerType::QPID;\npub const NSQ: BrokerType = BrokerType::NSQ;\npub const TCP: BrokerType = BrokerType::TCP;\npub const REDIS: BrokerType = BrokerType::REDIS;\npub const NETCHAN: BrokerType = BrokerType::NETCHAN;\npub const MOCK: BrokerType = BrokerType::MOCK;\n","traces":[{"line":37,"address":[],"length":0,"stats":{"Line":13}},{"line":38,"address":[],"length":0,"stats":{"Line":13}},{"line":39,"address":[],"length":0,"stats":{"Line":1}},{"line":40,"address":[],"length":0,"stats":{"Line":1}},{"line":41,"address":[],"length":0,"stats":{"Line":1}},{"line":42,"address":[],"length":0,"stats":{"Line":2}},{"line":43,"address":[],"length":0,"stats":{"Line":1}},{"line":44,"address":[],"length":0,"stats":{"Line":1}},{"line":45,"address":[],"length":0,"stats":{"Line":1}},{"line":46,"address":[],"length":0,"stats":{"Line":1}},{"line":47,"address":[],"length":0,"stats":{"Line":1}},{"line":48,"address":[],"length":0,"stats":{"Line":1}},{"line":49,"address":[],"length":0,"stats":{"Line":1}},{"line":50,"address":[],"length":0,"stats":{"Line":1}}],"covered":14,"coverable":14},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","config","tests.rs"],"content":"#[cfg(test)]\nmod tests {\n    use super::*;\n    use std::env;\n    use std::fs;\n    use std::path::Path;\n    use tempfile::tempdir;\n\n    #[test]\n    fn test_default_config() {\n        // Test that the default configuration can be loaded\n        let config = load_config(\"nonexistent_file.toml\").expect(\"Failed to load default config\");\n        \n        // Check that the default values are set\n        assert_eq!(config.nats.nats_server, \"nats://localhost:4222\");\n        assert_eq!(config.kafka.kafka_brokers, \"localhost:9092\");\n        assert_eq!(config.rabbitmq.rabbitmq_server, \"amqp://guest:guest@localhost:5672/\");\n        assert_eq!(config.amqp1.amqp_server, \"amqp://0.0.0.0:5672/\");\n        assert_eq!(config.mqtt.mqtt_broker, \"tcp://localhost:1883\");\n        assert_eq!(config.qpid.qpid_server, \"localhost\");\n        assert_eq!(config.nsq.nsq_server, \"localhost\");\n        assert_eq!(config.tcp.tcp_host, \"localhost\");\n        assert_eq!(config.redis.redis_server, \"redis://localhost:6379/\");\n        assert_eq!(config.netchan.netchan_server, \"localhost:9000\");\n    }\n\n    #[test]\n    fn test_load_config_from_file() {\n        // Create a temporary directory\n        let dir = tempdir().expect(\"Failed to create temporary directory\");\n        let config_path = dir.path().join(\"test_config.toml\");\n        \n        // Create a test configuration file\n        let config_content = r#\"\n            [nats]\n            nats_server = \"nats://example.com:4222\"\n            \n            [kafka]\n            kafka_brokers = \"example.com:9092\"\n            \n            [rabbitmq]\n            rabbitmq_server = \"amqp://user:pass@example.com:5672/\"\n        \"#;\n        fs::write(\u0026config_path, config_content).expect(\"Failed to write test config file\");\n        \n        // Load the configuration from the file\n        let config = load_config(config_path.to_str().unwrap()).expect(\"Failed to load config from file\");\n        \n        // Check that the values from the file are used\n        assert_eq!(config.nats.nats_server, \"nats://example.com:4222\");\n        assert_eq!(config.kafka.kafka_brokers, \"example.com:9092\");\n        assert_eq!(config.rabbitmq.rabbitmq_server, \"amqp://user:pass@example.com:5672/\");\n        \n        // Check that default values are used for fields not in the file\n        assert_eq!(config.amqp1.amqp_server, \"amqp://0.0.0.0:5672/\");\n        assert_eq!(config.mqtt.mqtt_broker, \"tcp://localhost:1883\");\n    }\n\n    #[test]\n    fn test_load_config_from_env() {\n        // Set environment variables\n        env::set_var(\"HYBRIDPIPE_NATS_NATS_SERVER\", \"nats://env.example.com:4222\");\n        env::set_var(\"HYBRIDPIPE_KAFKA_KAFKA_BROKERS\", \"env.example.com:9092\");\n        \n        // Load the configuration\n        let config = load_config(\"nonexistent_file.toml\").expect(\"Failed to load config with env vars\");\n        \n        // Check that the values from environment variables are used\n        assert_eq!(config.nats.nats_server, \"nats://env.example.com:4222\");\n        assert_eq!(config.kafka.kafka_brokers, \"env.example.com:9092\");\n        \n        // Clean up\n        env::remove_var(\"HYBRIDPIPE_NATS_NATS_SERVER\");\n        env::remove_var(\"HYBRIDPIPE_KAFKA_KAFKA_BROKERS\");\n    }\n\n    #[test]\n    fn test_get_config() {\n        // Initialize the configuration\n        init_config().expect(\"Failed to initialize config\");\n        \n        // Get the configuration\n        let config = get_config().expect(\"Failed to get config\");\n        \n        // Check that the configuration is valid\n        assert_eq!(config.nats.nats_server, \"nats://localhost:4222\");\n    }\n\n    #[test]\n    fn test_get_protocol_config() {\n        // Initialize the configuration\n        init_config().expect(\"Failed to initialize config\");\n        \n        // Get the configuration for a specific protocol\n        let nats_config = get_protocol_config(BrokerType::NATS).expect(\"Failed to get NATS config\");\n        let nats_config = nats_config.downcast_ref::\u003cNATSConfig\u003e().expect(\"Failed to downcast to NATSConfig\");\n        \n        // Check that the configuration is valid\n        assert_eq!(nats_config.nats_server, \"nats://localhost:4222\");\n        \n        // Get the configuration for another protocol\n        let kafka_config = get_protocol_config(BrokerType::KAFKA).expect(\"Failed to get Kafka config\");\n        let kafka_config = kafka_config.downcast_ref::\u003cKafkaConfig\u003e().expect(\"Failed to downcast to KafkaConfig\");\n        \n        // Check that the configuration is valid\n        assert_eq!(kafka_config.kafka_brokers, \"localhost:9092\");\n        \n        // Try to get the configuration for an unregistered protocol\n        let result = get_protocol_config(BrokerType::RESERVED1);\n        assert!(result.is_err());\n        match result {\n            Err(Error::BrokerTypeNotRegistered(broker_type)) =\u003e {\n                assert_eq!(broker_type, \"RESERVED1\");\n            }\n            _ =\u003e panic!(\"Expected BrokerTypeNotRegistered error\"),\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","config.rs"],"content":"// Configuration module for HybridPipe\n//\n// This module defines the configuration system for HybridPipe.\n\nuse config::{Config, ConfigError, Environment, File};\nuse serde::{Deserialize, Serialize};\nuse std::any::Any;\nuse std::env;\nuse std::path::Path;\nuse std::sync::OnceLock;\n\nuse super::Error;\n\n// Global configuration instance\nstatic CONFIG: OnceLock\u003cHybridPipeConfig\u003e = OnceLock::new();\n\n/// HybridPipeConfig is the main configuration struct for HybridPipe.\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct HybridPipeConfig {\n    /// NATS configuration\n    #[serde(default)]\n    pub nats: NATSConfig,\n\n    /// Kafka configuration\n    #[serde(default)]\n    pub kafka: KafkaConfig,\n\n    /// RabbitMQ configuration\n    #[serde(default)]\n    pub rabbitmq: RabbitMQConfig,\n\n    /// AMQP 1.0 configuration\n    #[serde(default)]\n    pub amqp1: AMQP1Config,\n\n    /// MQTT configuration\n    #[serde(default)]\n    pub mqtt: MQTTConfig,\n\n    /// Qpid configuration\n    #[serde(default)]\n    pub qpid: QpidConfig,\n\n    /// NSQ configuration\n    #[serde(default)]\n    pub nsq: NSQConfig,\n\n    /// TCP configuration\n    #[serde(default)]\n    pub tcp: TCPConfig,\n\n    /// Redis configuration\n    #[serde(default)]\n    pub redis: RedisConfig,\n\n    /// NetChan configuration\n    #[serde(default)]\n    pub netchan: NetChanConfig,\n\n    /// General configuration\n    #[serde(default)]\n    pub general: GeneralConfig,\n}\n\n/// NATS configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct NATSConfig {\n    /// NATS server address\n    #[serde(default = \"default_nats_server\")]\n    pub n_servers: String,\n\n    /// NATS client port\n    #[serde(default = \"default_nats_client_port\")]\n    pub n_lport: u16,\n\n    /// NATS monitoring port\n    #[serde(default = \"default_nats_monitoring_port\")]\n    pub n_mport: u16,\n\n    /// NATS cluster port\n    #[serde(default = \"default_nats_cluster_port\")]\n    pub n_cport: u16,\n\n    /// NATS client certificate file\n    #[serde(default)]\n    pub nats_cert_file: String,\n\n    /// NATS client key file\n    #[serde(default)]\n    pub nats_key_file: String,\n\n    /// NATS CA certificate file\n    #[serde(default)]\n    pub nats_ca_file: String,\n\n    /// Allow reconnection\n    #[serde(default = \"default_true\")]\n    pub n_allow_reconnect: bool,\n\n    /// Maximum reconnection attempts\n    #[serde(default = \"default_max_attempts\")]\n    pub n_max_attempt: u32,\n\n    /// Reconnection wait time in seconds\n    #[serde(default = \"default_reconnect_wait\")]\n    pub n_reconnect_wait: u32,\n\n    /// Connection timeout in seconds\n    #[serde(default = \"default_timeout\")]\n    pub n_timeout: u32,\n}\n\n/// Kafka configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct KafkaConfig {\n    /// Kafka server address\n    #[serde(default = \"default_kafka_server\")]\n    pub k_servers: String,\n\n    /// Kafka port\n    #[serde(default = \"default_kafka_port\")]\n    pub k_lport: u16,\n\n    /// Connection timeout in seconds\n    #[serde(default = \"default_timeout\")]\n    pub k_timeout: u32,\n\n    /// Kafka client certificate file\n    #[serde(default)]\n    pub kafka_cert_file: String,\n\n    /// Kafka client key file\n    #[serde(default)]\n    pub kafka_key_file: String,\n\n    /// Kafka CA certificate file\n    #[serde(default)]\n    pub kafka_ca_file: String,\n}\n\n// Default values for configuration\nfn default_nats_server() -\u003e String {\n    \"localhost\".to_string()\n}\nfn default_nats_client_port() -\u003e u16 {\n    4222\n}\nfn default_nats_monitoring_port() -\u003e u16 {\n    8222\n}\nfn default_nats_cluster_port() -\u003e u16 {\n    6222\n}\nfn default_kafka_server() -\u003e String {\n    \"localhost\".to_string()\n}\nfn default_kafka_port() -\u003e u16 {\n    9093\n}\nfn default_true() -\u003e bool {\n    true\n}\nfn default_max_attempts() -\u003e u32 {\n    10\n}\nfn default_reconnect_wait() -\u003e u32 {\n    5\n}\nfn default_timeout() -\u003e u32 {\n    10\n}\n\n// Additional configuration structs would be defined here\n\n/// RabbitMQ configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct RabbitMQConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_rabbitmq_server\")]\n    pub r_server_port: String,\n}\n\nfn default_rabbitmq_server() -\u003e String {\n    \"amqp://guest:guest@localhost:5672/\".to_string()\n}\n\n/// AMQP 1.0 configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct AMQP1Config {\n    // Fields would be defined here\n    #[serde(default = \"default_amqp_server\")]\n    pub amqp_server: String,\n\n    #[serde(default = \"default_amqp_port\")]\n    pub amqp_port: u16,\n}\n\nfn default_amqp_server() -\u003e String {\n    \"amqp://0.0.0.0:5672/\".to_string()\n}\nfn default_amqp_port() -\u003e u16 {\n    5672\n}\n\n/// MQTT configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct MQTTConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_mqtt_broker\")]\n    pub mqtt_broker: String,\n}\n\nfn default_mqtt_broker() -\u003e String {\n    \"tcp://localhost:1883\".to_string()\n}\n\n/// Qpid configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct QpidConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_qpid_server\")]\n    pub qpid_server: String,\n}\n\nfn default_qpid_server() -\u003e String {\n    \"localhost\".to_string()\n}\n\n/// NSQ configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct NSQConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_nsq_server\")]\n    pub nsq_server: String,\n}\n\nfn default_nsq_server() -\u003e String {\n    \"localhost\".to_string()\n}\n\n/// TCP configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct TCPConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_tcp_host\")]\n    pub tcp_host: String,\n}\n\nfn default_tcp_host() -\u003e String {\n    \"localhost\".to_string()\n}\n\n/// Redis configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct RedisConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_redis_address\")]\n    pub redis_address: String,\n}\n\nfn default_redis_address() -\u003e String {\n    \"localhost\".to_string()\n}\n\n/// NetChan configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct NetChanConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_netchan_server\")]\n    pub netchan_server: String,\n}\n\nfn default_netchan_server() -\u003e String {\n    \"localhost\".to_string()\n}\n\n/// General configuration\n#[derive(Debug, Clone, Deserialize, Serialize, Default)]\npub struct GeneralConfig {\n    // Fields would be defined here\n    #[serde(default = \"default_db_location\")]\n    pub db_location: String,\n}\n\nfn default_db_location() -\u003e String {\n    \"/etc/hybridpipe\".to_string()\n}\n\n/// Initialize the configuration system.\npub fn init_config() -\u003e Result\u003c(), Error\u003e {\n    if CONFIG.get().is_some() {\n        return Ok(());\n    }\n\n    let config_path =\n        env::var(\"HYBRIDPIPE_CONFIG\").unwrap_or_else(|_| \"hybridpipe_db.toml\".to_string());\n\n    let config = load_config(\u0026config_path)\n        .map_err(|e| Error::InvalidConfiguration(format!(\"Failed to load config: {}\", e)))?;\n\n    CONFIG\n        .set(config)\n        .map_err(|_| Error::InternalError(\"Failed to set global configuration\".to_string()))?;\n\n    Ok(())\n}\n\n/// Load the configuration from a file.\nfn load_config(config_path: \u0026str) -\u003e Result\u003cHybridPipeConfig, ConfigError\u003e {\n    let mut builder = Config::builder();\n\n    // Add default configuration\n    builder = builder.add_source(File::from_str(\n        include_str!(\"../../default_config.toml\"),\n        config::FileFormat::Toml,\n    ));\n\n    // Add configuration from file if it exists\n    if Path::new(config_path).exists() {\n        builder = builder.add_source(File::with_name(config_path));\n    }\n\n    // Add configuration from environment variables\n    builder = builder.add_source(Environment::with_prefix(\"HYBRIDPIPE\").separator(\"_\"));\n\n    // Build the configuration\n    let config = builder.build()?;\n\n    // Deserialize the configuration\n    config.try_deserialize()\n}\n\n/// Get the global configuration instance.\npub fn get_config() -\u003e Result\u003c\u0026'static HybridPipeConfig, Error\u003e {\n    if let Some(config) = CONFIG.get() {\n        Ok(config)\n    } else {\n        init_config()?;\n        CONFIG\n            .get()\n            .ok_or_else(|| Error::InternalError(\"Failed to get global configuration\".to_string()))\n    }\n}\n\n/// Get the configuration for a specific protocol.\npub fn get_protocol_config(broker_type: super::BrokerType) -\u003e Result\u003c\u0026'static dyn Any, Error\u003e {\n    let config = get_config()?;\n\n    match broker_type {\n        super::BrokerType::NATS =\u003e Ok(\u0026config.nats as \u0026dyn Any),\n        super::BrokerType::KAFKA =\u003e Ok(\u0026config.kafka as \u0026dyn Any),\n        super::BrokerType::RABBITMQ =\u003e Ok(\u0026config.rabbitmq as \u0026dyn Any),\n        super::BrokerType::AMQP1 =\u003e Ok(\u0026config.amqp1 as \u0026dyn Any),\n        super::BrokerType::MQTT =\u003e Ok(\u0026config.mqtt as \u0026dyn Any),\n        super::BrokerType::QPID =\u003e Ok(\u0026config.qpid as \u0026dyn Any),\n        super::BrokerType::NSQ =\u003e Ok(\u0026config.nsq as \u0026dyn Any),\n        super::BrokerType::TCP =\u003e Ok(\u0026config.tcp as \u0026dyn Any),\n        super::BrokerType::REDIS =\u003e Ok(\u0026config.redis as \u0026dyn Any),\n        super::BrokerType::NETCHAN =\u003e Ok(\u0026config.netchan as \u0026dyn Any),\n        _ =\u003e Err(Error::BrokerTypeNotRegistered(broker_type.to_string())),\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::core::broker_types::BrokerType;\n    use std::env;\n    use std::fs;\n    use std::path::Path;\n    use tempfile::tempdir;\n\n    #[test]\n    fn test_default_config() {\n        // Test that the default configuration can be loaded\n        let config = load_config(\"nonexistent_file.toml\").expect(\"Failed to load default config\");\n\n        // Check that the default values are set\n        assert_eq!(config.nats.n_servers, \"localhost\");\n        assert_eq!(config.nats.n_lport, 4222);\n        assert_eq!(config.nats.n_mport, 8222);\n        assert_eq!(config.nats.n_cport, 6222);\n        assert_eq!(config.nats.n_allow_reconnect, true);\n        assert_eq!(config.nats.n_max_attempt, 10);\n        assert_eq!(config.nats.n_reconnect_wait, 5);\n        assert_eq!(config.nats.n_timeout, 2);\n\n        assert_eq!(config.kafka.k_servers, \"localhost\");\n        assert_eq!(config.kafka.k_lport, 9093);\n        assert_eq!(config.kafka.k_timeout, 10);\n\n        assert_eq!(\n            config.rabbitmq.r_server_port,\n            \"amqp://guest:guest@localhost:5672/\"\n        );\n        assert_eq!(config.amqp1.amqp_server, \"amqp://0.0.0.0:5672/\");\n        assert_eq!(config.amqp1.amqp_port, 5672);\n        assert_eq!(config.mqtt.mqtt_broker, \"tcp://localhost:1883\");\n        assert_eq!(config.qpid.qpid_server, \"localhost\");\n        assert_eq!(config.nsq.nsq_server, \"localhost\");\n        assert_eq!(config.tcp.tcp_host, \"localhost\");\n        assert_eq!(config.redis.redis_address, \"localhost\");\n        assert_eq!(config.netchan.netchan_server, \"localhost\");\n        assert_eq!(config.general.db_location, \"/etc/hybridpipe\");\n    }\n\n    #[test]\n    fn test_load_config_from_file() {\n        // Create a temporary directory\n        let dir = tempdir().expect(\"Failed to create temporary directory\");\n        let config_path = dir.path().join(\"test_config.toml\");\n\n        // Create a test configuration file\n        let config_content = r#\"\n            [nats]\n            n_servers = \"test-server\"\n            n_lport = 4223\n\n            [kafka]\n            k_servers = \"test-kafka\"\n            k_lport = 9094\n        \"#;\n        fs::write(\u0026config_path, config_content).expect(\"Failed to write test config file\");\n\n        // Load the configuration from the file\n        let config =\n            load_config(config_path.to_str().unwrap()).expect(\"Failed to load config from file\");\n\n        // Check that the values from the file are used\n        assert_eq!(config.nats.n_servers, \"test-server\");\n        assert_eq!(config.nats.n_lport, 4223);\n        assert_eq!(config.kafka.k_servers, \"test-kafka\");\n        assert_eq!(config.kafka.k_lport, 9094);\n\n        // Check that default values are used for fields not in the file\n        assert_eq!(config.nats.n_mport, 8222);\n        assert_eq!(config.nats.n_cport, 6222);\n        assert_eq!(config.nats.n_allow_reconnect, true);\n        assert_eq!(config.nats.n_max_attempt, 10);\n        assert_eq!(config.nats.n_reconnect_wait, 5);\n        assert_eq!(config.nats.n_timeout, 2);\n    }\n\n    #[test]\n    #[ignore]\n    fn test_load_config_from_env() {\n        // This test modifies environment variables which can affect other tests\n        // So we'll ignore it for now\n\n        // Set environment variables\n        env::set_var(\"HYBRIDPIPE_NATS_N_SERVERS\", \"env-server\");\n        env::set_var(\"HYBRIDPIPE_NATS_N_LPORT\", \"4224\");\n        env::set_var(\"HYBRIDPIPE_KAFKA_K_SERVERS\", \"env-kafka\");\n        env::set_var(\"HYBRIDPIPE_KAFKA_K_LPORT\", \"9095\");\n\n        // Load the configuration\n        let config =\n            load_config(\"nonexistent_file.toml\").expect(\"Failed to load config with env vars\");\n\n        // Check that the values from environment variables are used\n        assert_eq!(config.nats.n_servers, \"env-server\");\n        assert_eq!(config.nats.n_lport, 4224);\n        assert_eq!(config.kafka.k_servers, \"env-kafka\");\n        assert_eq!(config Create a new background context with no deadline or cancellation.\n    pub fn background() -\u003e Self {\n        let (tx, rx) = oneshot::channel();\n        Self {\n            inner: Arc::new(ContextInner {\n                deadline: None,\n                cancel_rx: Some(rx),\n                cancel_tx: Some(tx),\n            }),\n        }\n    }\n\n    /// Create a new context with a timeout.\n    pub fn with_timeout(parent: \u0026Self, timeout_duration: Duration) -\u003e Self {\n        let deadline = Some(Instant::now() + timeout_duration);\n        let (tx, rx) = oneshot::channel();\n        Self {\n            inner: Arc::new(ContextInner {\n                deadline,\n                cancel_rx: Some(rx),\n                cancel_tx: Some(tx),\n            }),\n        }\n    }\n\n    /// Create a new context with a deadline.\n    pub fn with_deadline(parent: \u0026Self, deadline: Instant) -\u003e Self {\n        let (tx, rx) = oneshot::channel();\n        Self {\n            inner: Arc::new(ContextInner {\n                deadline: Some(deadline),\n                cancel_rx: Some(rx),\n                cancel_tx: Some(tx),\n            }),\n        }\n    }\n\n    /// Create a new context that can be cancelled.\n    pub fn with_cancel(parent: \u0026Self) -\u003e (Self, CancelFn) {\n        let (tx, rx) = oneshot::channel();\n        let ctx = Self {\n            inner: Arc::new(ContextInner {\n                deadline: parent.inner.deadline,\n                cancel_rx: Some(rx),\n                cancel_tx: None,\n            }),\n        };\n        let cancel_fn = CancelFn {\n            cancel_tx: Some(tx),\n        };\n        (ctx, cancel_fn)\n    }\n\n    /// Check if the context is done (cancelled or timed out).\n    pub async fn done(\u0026self) -\u003e bool {\n        if let Some(deadline) = self.inner.deadline {\n            if Instant::now() \u003e= deadline {\n                return true;\n            }\n        }\n\n        // We can't check the cancel_rx directly because it's not Clone or Copy\n        // Instead, we'll just return false here and let the actual cancellation\n        // be handled by the run method\n        false\n    }\n\n    /// Get the deadline for the context, if any.\n    pub fn deadline(\u0026self) -\u003e Option\u003cInstant\u003e {\n        self.inner.deadline\n    }\n\n    /// Run a future with this context, returning an error if the context is done before the future completes.\n    pub async fn run\u003cF, T, E\u003e(\u0026self, future: F) -\u003e Result\u003cT, E\u003e\n    where\n        F: std::future::Future\u003cOutput = Result\u003cT, E\u003e\u003e,\n        E: From\u003cstd::io::Error\u003e,\n    {\n        if let Some(deadline) = self.inner.deadline {\n            let now = Instant::now();\n            if now \u003e= deadline {\n                return Err(std::io::Error::new(\n                    std::io::ErrorKind::TimedOut,\n                    \"context deadline exceeded\",\n                )\n                .into());\n            }\n\n            let duration = deadline - now;\n            match timeout(duration, future).await {\n                Ok(result) =\u003e result,\n                Err(_) =\u003e Err(std::io::Error::new(\n                    std::io::ErrorKind::TimedOut,\n                    \"context deadline exceeded\",\n                )\n                .into()),\n            }\n        } else {\n            future.await\n        }\n    }\n}\n\n/// CancelFn is a function that cancels a context.\npub struct CancelFn {\n    cancel_tx: Option\u003coneshot::Sender\u003c()\u003e\u003e,\n}\n\nimpl CancelFn {\n    /// Cancel the context.\n    pub fn cancel(\u0026mut self) {\n        if let Some(tx) = self.cancel_tx.take() {\n            let _ = tx.send(());\n        }\n    }\n}\n","traces":[{"line":29,"address":[],"length":0,"stats":{"Line":6}},{"line":30,"address":[],"length":0,"stats":{"Line":6}},{"line":32,"address":[],"length":0,"stats":{"Line":6}},{"line":41, ,"coverable":39},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","errors.rs"],"content":"// Error types for HybridPipe\n//\n// This module defines the error types used by HybridPipe.\n\nuse thiserror::Error;\n\n/// Result type for HybridPipe operations\npub type Result\u003cT\u003e = std::result::Result\u003cT, Error\u003e;\n\n/// Error represents all possible errors returned by HybridPipe.\n#[derive(Error, Debug)]\npub enum Error {\n    /// NotConnected is returned when an operation is attempted on a disconnected HybridPipe.\n    #[error(\"not connected to messaging system\")]\n    NotConnected,\n\n    /// PipeNotFound is returned when an operation is attempted on a non-existent pipe.\n    #[error(\"pipe not found: {0}\")]\n    PipeNotFound(String),\n\n    /// AlreadyConnected is returned when Connect is called on an already connected HybridPipe.\n    #[error(\"already connected to messaging system\")]\n    AlreadyConnected,\n\n    /// AlreadySubscribed is returned when Subscribe is called on an already subscribed pipe.\n    #[error(\"already subscribed to pipe: {0}\")]\n    AlreadySubscribed(String),\n\n    /// NotSubscribed is returned when Unsubscribe is called on a non-subscribed pipe.\n    #[error(\"not subscribed to pipe: {0}\")]\n    NotSubscribed(String),\n\n    /// InvalidConfiguration is returned when the configuration is invalid.\n    #[error(\"invalid configuration: {0}\")]\n    InvalidConfiguration(String),\n\n    /// SerializationError is returned when serialization fails.\n    #[error(\"serialization error: {0}\")]\n    SerializationError(String),\n\n    /// DeserializationError is returned when deserialization fails.\n    #[error(\"deserialization error: {0}\")]\n    DeserializationError(String),\n\n    /// ConnectionError is returned when a connection error occurs.\n    #[error(\"connection error: {0}\")]\n    ConnectionError(String),\n\n    /// DispatchError is returned when a dispatch error occurs.\n    #[error(\"dispatch error: {0}\")]\n    DispatchError(String),\n\n    /// SubscriptionError is returned when a subscription error occurs.\n    #[error(\"subscription error: {0}\")]\n    SubscriptionError(String),\n\n    /// UnsubscriptionError is returned when an unsubscription error occurs.\n    #[error(\"unsubscription error: {0}\")]\n    UnsubscriptionError(String),\n\n    /// TimeoutError is returned when an operation times out.\n    #[error(\"timeout error: {0}\")]\n    TimeoutError(String),\n\n    /// BrokerTypeNotRegistered is returned when a broker type is not registered.\n    #[error(\"broker type not registered: {0}\")]\n    BrokerTypeNotRegistered(String),\n\n    /// InternalError is returned when an internal error occurs.\n    #[error(\"internal error: {0}\")]\n    InternalError(String),\n\n    /// IOError is returned when an I/O error occurs.\n    #[error(\"I/O error: {0}\")]\n    IOError(#[from] std::io::Error),\n\n    /// Other is returned when an error doesn't fit into any of the above categories.\n    #[error(\"other error: {0}\")]\n    Other(String),\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","mod.rs"],"content":"// Core module for HybridPipe\n//\n// This module defines the core interfaces and functionality for the HybridPipe messaging system.\n\nuse async_trait::async_trait;\nuse std::any::Any;\nuse std::sync::Arc;\nuse thiserror::Error;\n\npub mod broker_types;\npub mod config;\npub mod context;\npub mod errors;\npub mod registry;\n\n// Re-export the broker types\npub use broker_types::BrokerType;\npub use errors::{Error, Result};\npub use registry::{deploy_router, register_router_factory};\n\n/// Process defines the callback function that should be called when a client receives a message.\npub type Process = Box\u003cdyn Fn(Vec\u003cu8\u003e) -\u003e Result\u003c()\u003e + Send + Sync\u003e;\n\n/// Extension methods for HybridPipe that are not object-safe.\n/// These are implemented as standalone functions.\npub mod ext {\n    use super::*;\n    use crate::serialization::decode;\n\n    /// Accept subscribes to messages from the specified pipe and processes them with the provided function.\n    /// This is an alias for Subscribe for backward compatibility.\n    pub async fn accept\u003cT, F\u003e(pipe: \u0026dyn HybridPipe, pipe_name: \u0026str, callback: F) -\u003e Result\u003c()\u003e\n    where\n        T: 'static + Send + Sync + serde::de::DeserializeOwned,\n        F: Fn(Box\u003cdyn Any + Send + Sync\u003e) + Send + Sync + 'static,\n    {\n        // Create a Process wrapper for the callback\n        let process: Process = Box::new(move |data| {\n            let decoded: Box\u003cdyn Any + Send + Sync\u003e = match decode::\u003cT\u003e(\u0026data) {\n                Ok(decoded) =\u003e Box::new(decoded),\n                Err(e) =\u003e return Err(e),\n            };\n            callback(decoded);\n            Ok(())\n        });\n\n        pipe.subscribe(pipe_name, process).await\n    }\n}\n\n/// HybridPipe defines the core interface for all messaging implementations.\n/// Any messaging system implementation must satisfy this interface.\n#[async_trait]\npub trait HybridPipe: Send + Sync {\n    /// Connect establishes a connection to the messaging system.\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e;\n\n    /// Disconnect closes the connection to the messaging system.\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e;\n\n    /// Dispatch sends a message to the specified pipe.\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e;\n\n    /// DispatchWithContext sends a message with context for cancellation and timeouts.\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e;\n\n    /// Subscribe registers a callback function to be called when messages arrive on the specified pipe.\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e;\n\n    /// SubscribeWithContext registers a callback with context for cancellation.\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e;\n\n    /// Remove unsubscribes from the specified pipe.\n    /// This is an alias for Unsubscribe for backward compatibility.\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e;\n\n    /// Unsubscribe removes a subscription from the specified pipe.\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e;\n\n    /// Close terminates the connection to the messaging system.\n    /// This is an alias for Disconnect for backward compatibility.\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e;\n\n    /// IsConnected returns true if the connection to the messaging system is active.\n    fn is_connected(\u0026self) -\u003e bool;\n}\n\n/// RouterFactory is a function that creates a new instance of a HybridPipe implementation.\npub type RouterFactory = Box\u003cdyn Fn() -\u003e Arc\u003cdyn HybridPipe\u003e + Send + Sync\u003e;\n\n// Type alias for a boxed HybridPipe trait object\npub type BoxedHybridPipe = Arc\u003cdyn HybridPipe\u003e;\n\n// Tests for the core module\n#[cfg(test)]\nmod tests;\n","traces":[{"line":32,"address":[],"length":0,"stats":{"Line":6}},{"line":38,"address":[],"length":0,"stats":{"Line":10}},{"line":39,"address":[],"length":0,"stats":{"Line":8}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{" S.read().unwrap();\n    types.get(\u0026broker_type).copied()\n}\n","traces":[{"line":18,"address":[],"length":0,"stats":{"Line":2}},{"line":19,"address":[],"length":0,"stats":{"Line":2}},{"line":20,"address":[],"length":0,"stats":{"Line":2}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}},{"line":26,"address":[],"length":0,"stats":{"Line":0}},{"line":30,"address":[],"length":0,"stats":{"Line":2}},{"line":32,"address":[],"length":0,"stats":{"Line":2}},{"line":33,"address":[],"length":0,"stats":{"Line":3}},{"line":39,"address":[],"length":0,"stats":{"Line":1}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}}],"covered":7,"coverable":13},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","tests.rs"],"content":"#[cfg(test)]\nmod tests {\n    use crate::core::broker_types::{self, BrokerType};\n    use crate::core::config::{get_config, get_protocol_config, init_config};\n    use crate::core::context::{CancelFn, Context};\n    use crate::core::errors::Error;\n    use crate::core::registry::{deploy_router, register_router_factory};\n    use crate::core::RouterFactory;\n    use crate::protocols::mock::Packet as MockPacket;\n    use std::sync::Arc;\n    use std::time::{Duration, Instant};\n    use tokio::time::sleep;\n\n    // Tests for broker_types module\n    mod broker_types_tests {\n        use super::*;\n\n        #[test]\n        fn test_broker_type_display() {\n            // Test the Display implementation for BrokerType\n            assert_eq!(BrokerType::NATS.to_string(), \"NATS\");\n            assert_eq!(BrokerType::KAFKA.to_string(), \"KAFKA\");\n            assert_eq!(BrokerType::RABBITMQ.to_string(), \"RABBITMQ\");\n            assert_eq!(BrokerType::RESERVED1.to_string(), \"RESERVED1\");\n            assert_eq!(BrokerType::AMQP1.to       // Connect to the router\n            router.connect().await.expect(\"Failed to connect\");\n\n            // Check that the router is connected\n            assert!(router.is_connected());\n\n            // Disconnect from the router\n            router.disconnect().await.expect(\"Failed to disconnect\");\n\n            // Check that the router is disconnected\n            assert!(!router.is_connected());\n        }\n\n        #[tokio::test]\n        async fn test_deploy_router_unregistered() {\n            // Try to deploy a router for an unregistered broker type\n            let result = deploy_router(BrokerType::RESERVED1);\n\n            // Check that the result is an error\n            assert!(result.is_err());\n\n            // Check that the error is of the correct type\n            match result {\n                Err(Error::BrokerTypeNotRegistered(broker_type)) =\u003e {\n                    assert_eq!(broker_type, \"RESERVED1\");\n                }\n                _ =\u003e panic!(\"Expected BrokerTypeNotRegistered error\"),\n            }\n        }\n    }\n\n    // Tests for errors module\n    mod errors_tests {\n        use super::*;\n\n        #[test]\n        fn test_error_display() {\n            // Test the Display implementation for Error\n            assert_eq!(\n                Error::NotConnected.to_string(),\n                \"not connected to messaging system\"\n            );\n            assert_eq!(\n                Error::PipeNotFound(\"test-pipe\".to_string()).to_string(),\n                \"pipe not found: test-pipe\"\n            );\n            assert_eq!(\n                Error::AlreadyConnected.to_string(),\n                \"already connected to messaging system\"\n            );\n            assert_eq!(\n                Error::AlreadySubscribed(\"test-pipe\".to_string()).to_string(),\n                \"already subscribed to pipe: test-pipe\"\n            );\n            assert_eq!(\n                Error::NotSubscribed(\"test data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        _result: \u0026Result\u003c()\u003e,\n    ) {\n    }\n\n    /// Called before a message is processed by a subscriber.\n    async fn before_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        Ok(())\n    }\n\n    /// Called after a message is processed by a subscriber.\n    async fn after_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8], _result: \u0026Result\u003c()\u003e) {}\n}\n\n/// MiddlewareStack is a HybridPipe implementation that wraps another HybridPipe implementation\n/// and applies a stack of middleware to it.\npub struct MiddlewareStack {\n    /// The inner HybridPipe implementation.\n    inner: Arc\u003cdyn HybridPipe\u003e,\n    /// The stack of middleware to apply.\n    middleware: Vec\u003cBox\u003cdyn Middleware\u003e\u003e,\n}\n\nimpl MiddlewareStack {\n    /// Create a new middleware stack.\n    pub fn new(inner: Arc\u003cdyn HybridPipe\u003e) -\u003e Self {\n        Self {\n            inner,\n            middleware: Vec::new(),\n        }\n    }\n\n    /// Add a middleware to the stack.\n    pub fn add_middleware\u003cM: Middleware + 'static\u003e(\u0026mut self, middleware: M) {\n        self.middleware.push(Box::new(middleware));\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for MiddlewareStack {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        self.inner.connect().await\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        self.inner.disconnect().await\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Call before_dispatch on all middleware\n        for middleware in \u0026self.middleware {\n            middleware.before_dispatch(pipe, \u0026data).await?;\n        }\n\n        // Call the inner dispatch\n        let result = self.inner.dispatch(pipe, data).await;\n\n        // Call after_dispatch on all middleware in reverse order\n        for middleware in self.middleware.iter().rev() {\n            // We can't access the data anymore since it's been moved\n            // This is a limitation of the current design\n            let empty_data: Box\u003cdyn Any + Send + Sync\u003e = Box::new(());\n            middleware.after_dispatch(pipe, \u0026empty_data, \u0026result).await;\n        }\n\n        result\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Call before_dispatch on all middleware\n        for middleware in \u0026self.middleware {\n            middleware.before_dispatch(pipe, \u0026data).await?;\n        }\n\n        // Call the inner dispatch_with_context\n        let result = self.inner.dispatch_with_context(ctx, pipe, data).await;\n\n        // Call after_dispatch on all middleware in reverse order\n        for middleware in self.middleware.iter().rev() {\n            // We can't access the data anymore since it's been moved\n            // This is a limitation of the current design\n            let empty_data: Box\u003cdyn Any + Send + Sync\u003e = Box::new(());\n            middleware.after_dispatch(pipe, \u0026empty_data, \u0026result).await;\n        }\n\n        result\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Create a static callback that doesn't capture self\n        let callback_static = callback;\n\n        // For testing purposes, we'll just call the callback directly\n        // In a real implementation, we would need to find a way to apply middleware\n        // without cloning the middleware vector\n        let wrapped_callback: Process = Box::new(move |data: Vec\u003cu8\u003e| {\n            // Just call the original callback\n            callback_static(data)\n        });\n\n        self.inner.subscribe(pipe, wrapped_callback).await\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Create a static callback that doesn't capture self\n        let callback_static = callback;\n\n        // Create a wrapper callback that doesn't capture self\n        let wrapped_callback: Process = Box::new(move |data: Vec\u003cu8\u003e| {\n            // We can't directly use the middleware references in a static context\n            // So we'll just call the original callback\n            callback_static(data)\n        });\n\n        self.inner\n            .subscribe_with_context(ctx, pipe, wrapped_callback)\n            .await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.inner.remove(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.inner.unsubscribe(pipe).await\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.inner.close().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        self.inner.is_connected()\n    }\n}\n\n/// MonitoringMiddleware is a middleware that collects metrics about message processing.\npub struct MonitoringMiddleware {\n    /// The message stats collector.\n    stats: Arc\u003cMessageStats\u003e,\n}\n\nimpl MonitoringMiddleware {\n    /// Create a new monitoring middleware.\n    pub fn new(stats: Arc\u003cMessageStats\u003e) -\u003e Self {\n        Self { stats }\n    }\n}\n\n#[async_trait]\nimpl Middleware for MonitoringMiddleware {\n    fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n        // This middleware doesn't wrap a HybridPipe directly\n        panic!(\"MonitoringMiddleware doesn't wrap a HybridPipe directly\");\n    }\n\n    async fn before_dispatch(\u0026self, pipe: \u0026str, _data: \u0026Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        self.stats.record_dispatch_start(pipe);\n        Ok(())\n    }\n\n    async fn after_dispatch(\n        \u0026self,\n        pipe: \u0026str,\n        _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        result: \u0026Result\u003c()\u003e,\n    ) {\n        self.stats.record_dispatch_end(pipe, result.is_ok());\n    }\n\n    async fn before_process(\u0026self, pipe: \u0026str, data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        self.stats.record_process_start(pipe, data.len());\n        Ok(())\n    }\n\n    async fn after_process(\u0026self, pipe: \u0026str, _data: \u0026[u8], result: \u0026Result\u003c()\u003e) {\n        self.stats.record_process_end(pipe, result.is_ok());\n    }\n}\n\n/// LoggingMiddleware is a middleware that logs message processing.\npub struct LoggingMiddleware;\n\nimpl LoggingMiddleware {\n    /// Create a new logging middleware.\n    pub fn new() -\u003e Self {\n        Self\n    }\n}\n\n#[async_trait]\nimpl Middleware for LoggingMiddleware {\n    fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n        // This middleware doesn't wrap a HybridPipe directly\n        panic!(\"LoggingMiddleware doesn't wrap a HybridPipe directly\");\n    }\n\n    async fn before_dispatch(\u0026self, pipe: \u0026str, _data: \u0026Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        debug!(\"Dispatching message to pipe: {}\", pipe);\n        Ok(())\n    }\n\n    async fn after_dispatch(\n        \u0026self,\n        pipe: \u0026str,\n        _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        result: \u0026Result\u003c()\u003e,\n    ) {\n        match result {\n            Ok(_) =\u003e debug!(\"Successfully dispatched message to pipe: {}\", pipe),\n            Err(e) =\u003e debug!(\"Failed to dispatch message to pipe {}: {}\", pipe, e),\n        }\n    }\n\n    async fn before_process(\u0026self, pipe: \u0026str, data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        debug!(\n            \"Processing message from pipe: {} (size: {} bytes)\",\n            pipe,\n            data.len()\n        );\n        Ok(())\n    }\n\n    async fn after_process(\u0026self, pipe: \u0026str, _data: \u0026[u8], result: \u0026Result\u003c()\u003e) {\n        match result {\n            Ok(_) =\u003e debug!(\"Successfully processed message from pipe: {}\", pipe),\n            Err(e) =\u003e debug!(\"Failed to process message from pipe {}: {}\", pipe, e),\n        }\n    }\n}\n","traces":[{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":3}},{"line":59,"address":[],"length":0,"stats":{"Line":3}},{"line":64,"address":[],"length":0,"stats":{"Line":4}},{"line":65,"address":[],"length":0,"stats":{"Line":4}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":3}},{"line":76,"address":[],"length":0,"stats":{"Line":3}},{"line":79,"address":[],"length":0,"stats":{"Line":3}},{"line":81,"address":[],"length":0,"stats":{"Line":10}},{"line":82,"address":[],"length":0,"stats":{"Line":1}},{"line":86,"address":[],"length":0,"stats":{"Line":4}},{"line":89,"address":[],"length":0,"stats":{"Line":5}},{"line":92,"address":[],"length":0,"stats":{"Line":3}},{"line":93,"address":[],"length":0,"stats":{"Line":3}},{"line":96,"address":[],"length":0,"stats":{"Line":2}},{"line":106,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":0}},{"line":111,"address":[],"length":0,"stats":{"Line":0}},{"line":114,"address":[],"length":0,"stats":{"Line":0}},{"line":117,"address":[],"length":0,"sta fore_process_count: Arc\u003cMutex\u003cu32\u003e\u003e,\n        after_process_count: Arc\u003cMutex\u003cu32\u003e\u003e,\n        inner: Arc\u003cdyn HybridPipe\u003e,\n    }\n\n    impl CounterMiddleware {\n        fn new(inner: Arc\u003cdyn HybridPipe\u003e) -\u003e Self {\n            Self {\n                before_dispatch_count: Arc::new(Mutex::new(0)),\n                after_dispatch_count: Arc::new(Mutex::new(0)),\n                before_process_count: Arc::new(Mutex::new(0)),\n                after_process_count: Arc::new(Mutex::new(0)),\n                inner,\n            }\n        }\n\n        fn get_before_dispatch_count(\u0026self) -\u003e u32 {\n            *self.before_dispatch_count.lock().unwrap()\n        }\n\n        fn get_after_dispatch_count(\u0026self) -\u003e u32 {\n            *self.after_dispatch_count.lock().unwrap()\n        }\n\n        fn get_before_process_count(\u0026self) -\u003e u32 {\n            *self.before_process_count.lock().unwrap()\n        }\n\n        fn get_after_process_count(\u0026self) -\u003e u32 {\n            *self.after_process_count.lock().unwrap()\n        }\n    }\n\n    #[async_trait]\n    impl Middleware for CounterMiddleware {\n        fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n            self.inner.as_ref()\n        }\n\n        async fn before_dispatch(\n            \u0026self,\n            _pipe: \u0026str,\n            _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        ) -\u003e Result\u003c()\u003e {\n            let mut count = self.before_dispatch_count.lock().unwrap();\n            *count += 1;\n            Ok(())\n        }\n\n        async fn after_dispatch(\n            \u0026self,\n            _pipe: \u0026str,\n            _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n            _result: \u0026Result\u003c()\u003e,\n        ) {\n            let mut count = self.after_dispatch_count.lock().unwrap();\n            *count += 1;\n        }\n\n        async fn before_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n            let mut count = self.before_process_count.lock().unwrap();\n            *count += 1;\n            Ok(())\n        }\n\n        async fn after_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8], _result: \u0026Result\u003c()\u003e) {\n            let mut count = self.after_process_count.lock().unwrap();\n            *count += 1;\n        }\n    }\n\n    #[tokio::test]\n    async fn test_middleware_stack() {\n        // Create a mock router\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create a middleware\n        let counter = CounterMiddleware::new(mock.clone());\n\n        // Create a middleware stack\n        let mut stack = MiddlewareStack::new(mock.clone());\n        stack.add_middleware(counter.clone());\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Create a shared variable to store the received message\n        let received = Arc::new(TokioMutex::new(None));\n        let received_clone = received.clone();\n\n        // Subscribe to a pipe using the ext module\n        let received_clone2 = received_clone.clone();\n        crate::core::ext::accept::\u003cTestMessage, _\u003e(\u0026stack, \"test-pipe\", move |data| {\n            if let Some(msg) = data.downcast_ref::\u003cTestMessage\u003e() {\n                let msg_clone = msg.clone();\n                let received_clone3 = received_clone2.clone();\n                // Use a non-blocking approach\n                tokio::spawn(async move {\n                    let mut received = received_clone3.lock().await;\n                    *received = Some(msg_clone);\n                });\n            }\n        })\n        .await\n        .expect(\"Failed to subscribe\");\n\n        // Dispatch a message\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        stack\n            .dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await\n            .expect(\"Failed to dispatch\");\n\n        // Wait a bit for the message to be processed\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Check if the message was received\n        let received_msg = received.lock().await.clone();\n        assert!(received_msg.is_some());\n        assert_eq!(received_msg.unwrap(), test_msg);\n\n        // Check if the middleware was called\n        assert_eq!(counter.get_before_dispatch_count(), 1);\n        assert_eq!(counter.get_after_dispatch_count(), 1);\n        // Note: Process hooks are not called in the current implementation\n        assert_eq!(counter.get_before_process_count(), 0);\n        assert_eq!(counter.get_after_process_count(), 0);\n\n        // Clean up\n        stack.disconnect().await.expect(\"Failed to disconnect\");\n    }\n\n    #[tokio::test]\n    async fn test_middleware_chain() {\n        // Create a mock router\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create multiple middleware instances\n        let counter1 = CounterMiddleware::new(mock.clone());\n        let counter2 = CounterMiddleware::new(mock.clone());\n\n        // Create a middleware stack with multiple middleware\n        let mut stack = MiddlewareStack::new(mock.clone());\n        stack.add_middleware(counter1.clone());\n        stack.add_middleware(counter2.clone());\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Dispatch a message\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        stack\n            .dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await\n            .expect(\"Failed to dispatch\");\n\n        // Wait a bit for the message to be processed\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Check if both middleware were called\n        assert_eq!(counter1.get_before_dispatch_count(), 1);\n        assert_eq!(counter1.get_after_dispatch_count(), 1);\n        assert_eq!(counter2.get_before_dispatch_count(), 1);\n        assert_eq!(counter2.get_after_dispatch_count(), 1);\n\n        // Clean up\n        stack.disconnect().await.expect(\"Failed to disconnect\");\n    }\n\n    #[tokio::test]\n    async fn test_middleware_error_handling() {\n        // Create a mock router\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create a middleware that returns an error\n        struct ErrorMiddleware;\n\n        #[async_trait]\n        impl Middleware for ErrorMiddleware {\n            fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n                panic!(\"ErrorMiddleware doesn't wrap a HybridPipe directly\");\n            }\n\n            async fn before_dispatch(\n                \u0026self,\n                _pipe: \u0026str,\n                _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n            ) -\u003e Result\u003c()\u003e {\n                Err(Error::Other(\"Test error\".to_string()))\n            }\n        }\n\n        // Create a middleware stack with the error middleware\n        let mut stack = MiddlewareStack::new(mock.clone());\n        stack.add_middleware(ErrorMiddleware);\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Dispatch a message, which should fail\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        let result = stack\n            .dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await;\n        assert!(result.is_err());\n\n
