ns: {}\", trace.spans.len());\n    for span in \u0026trace.spans {\n        info!(\"    Span: {}\", span.name);\n        info!(\"      ID: {}\", span.id);\n        info!(\"      Start time: {:?}\", span.start_time);\n        if let Some(end_time) = span.end_time {\n            info!(\"      End time: {:?}\", end_time);\n        }\n        info!(\"      Success: {}\", span.success);\n        if !span.attributes.is_empty() {\n            info!(\"      Attributes:\");\n            for (key, value) in \u0026span.attributes {\n                info!(\"        {}: {}\", key, value);\n            }\n        }\n    }\n    \n    // End the trace\n    tracer.end_trace(\u0026trace_id);\n    \n    // Clean up\n    middleware_stack.disconnect().await?;\n    info!(\"Disconnected from mock messaging system\");\n    \n    Ok(())\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","examples","kafka_example.rs"],"content":"use hybridpipe::{deploy_router, BrokerType};\nuse serde::{Serialize, Deserialize};\nuse std::sync::Arc;\nuse tokio::signal;\nuse log::{info, error};\n\n#[derive(Debug, Clone, Serialize, Deserialize)]\nstruct Person {\n    name: String,\n    age: u32,\n    next_gen: Vec\u003cString\u003e,\n    c_age: Vec\u003cu32\u003e,\n}\n\n#[tokio::main]\nasync fn main() -\u003e Result\u003c(), Box\u003cdyn std::error::Error\u003e\u003e {\n    // Initialize logging\n    env_logger::init();\n    \n    info!(\"Starting HybridPipe Kafka Example\");\n    \n    // Connect to Kafka\n    let router = deploy_router(BrokerType::KAFKA)?;\n    router.connect().await?;\n    info!(\"Connected to Kafka\");\n    \n    // Create a message\n    let person = Person {\n        name: \"David Gower\".to_string(),\n        age: 75,\n        next_gen: vec![\"Pringle\".to_string(), \"NH Fairbrother\".to_string(), \"Wasim\".to_string()],\n        c_age: vec![45, 37, 39],\n    };\n    \n    // Subscribe to a pipe\n    rout  new background context with no deadline or cancellation.\n    pub fn background() -\u003e Self {\n        let (tx, rx) = oneshot::channel();\n        Self {\n            inner: Arc::new(ContextInner {\n                deadline: None,\n                cancel_rx: Some(rx),\n                cancel_tx: Some(tx),\n            }),\n        }\n    }\n\n    /// Create a new context with a timeout.\n    pub fn with_timeout(parent: \u0026Self, timeout_duration: Duration) -\u003e Self {\n        let deadline = Some(Instant::now() + timeout_duration);\n        let (tx, rx) = oneshot::channel();\n        Self {\n            inner: Arc::new(ContextInner {\n                deadline,\n                cancel_rx: Some(rx),\n                cancel_tx: Some(tx),\n            }),\n        }\n    }\n\n    /// Create a new context with a deadline.\n    pub fn with_deadline(parent: \u0026Self, deadline: Instant) -\u003e Self {\n        let (tx, rx) = oneshot::channel();\n        Self {\n            inner: Arc::new(ContextInner {\n                deadline: Some(deadline),\n                cancel_rx: Some(rx),\n                cancel_tx: Some(tx),\n            }),\n        }\n    }\n\n    /// Create a new context that can be cancelled.\n    pub fn with_cancel(parent: \u0026Self) -\u003e (Self, CancelFn) {\n        let (tx, rx) = oneshot::channel();\n        let ctx = Self {\n            inner: Arc::new(ContextInner {\n                deadline: parent.inner.deadline,\n                cancel_rx: Some(rx),\n                cancel_tx: None,\n            }),\n        };\n        let cancel_fn = CancelFn {\n            cancel_tx: Some(tx),\n        };\n        (ctx, cancel_fn)\n    }\n\n    /// Check if the context is done (cancelled or timed out).\n    pub async fn done(\u0026self) -\u003e bool {\n        if let Some(deadline) = self.inner.deadline {\n            if Instant::now() \u003e= deadline {\n                return true;\n            }\n        }\n\n        // We can't check the cancel_rx directly because it's not Clone or Copy\n        // Instead, we'll just return false here and let the actual cancellation\n        // be handled by the run method\n        false\n    }\n\n    /// Get the deadline for the context, if any.\n    pub fn deadline(\u0026self) -\u003e Option\u003cInstant\u003e {\n        self.inner.deadline\n    }\n\n    /// Run a future with this context, returning an error if the context is done before the future completes.\n    pub async fn run\u003cF, T, E\u003e(\u0026self, future: F) -\u003e Result\u003cT, E\u003e\n    where\n        F: std::future::Future\u003cOutput = Result\u003cT, E\u003e\u003e,\n        E: From\u003cstd::io::Error\u003e,\n    {\n        if let Some(deadline) = self.inner.deadline {\n            let now = Instant::now();\n            if now \u003e= deadline {\n                return Err(std::io::Error::new(\n                    std::io::ErrorKind::TimedOut,\n                    \"context deadline exceeded\",\n                )\n                .into());\n            }\n\n            let duration = deadline - now;\n            match timeout(duration, future).await {\n                Ok(result) =\u003e result,\n                Err(_) =\u003e Err(std::io::Error::new(\n                    std::io::ErrorKind::TimedOut,\n                    \"context deadline exceeded\",\n                )\n                .into()),\n            }\n        } else {\n            future.await\n        }\n    }\n}\n\n/// CancelFn is a function that cancels a context.\npub struct CancelFn {\n    cancel_tx: Option\u003coneshot::Sender\u003c()\u003e\u003e,\n}\n\nimpl CancelFn {\n    /// Cancel the context.\n    pub fn cancel(\u0026mut self) {\n        if let Some(tx) = self.cancel_tx.take() {\n            let _ = tx.send(());\n        }\n    }\n}\n","traces":[{"line":29,"address":[],"length":0,"stats":{"Line":6}},{"line":30,"address":[],"length":0,"stats":{"Line":6}},{"line":32,"address":[],"length":0,"stats":{"Line":6}},{"line":41,"address ble":39},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","errors.rs"],"content":"// Error types for HybridPipe\n//\n// This module defines the error types used by HybridPipe.\n\nuse thiserror::Error;\n\n/// Result type for HybridPipe operations\npub type Result\u003cT\u003e = std::result::Result\u003cT, Error\u003e;\n\n/// Error represents all possible errors returned by HybridPipe.\n#[derive(Error, Debug)]\npub enum Error {\n    /// NotConnected is returned when an operation is attempted on a disconnected HybridPipe.\n    #[error(\"not connected to messaging system\")]\n    NotConnected,\n\n    /// PipeNotFound is returned when an operation is attempted on a non-existent pipe.\n    #[error(\"pipe not found: {0}\")]\n    PipeNotFound(String),\n\n    /// AlreadyConnected is returned when Connect is called on an already connected HybridPipe.\n    #[error(\"already connected to messaging system\")]\n    AlreadyConnected,\n\n    /// AlreadySubscribed is returned when Subscribe is called on an already subscribed pipe.\n    #[error(\"already subscribed to pipe: {0}\")]\n    AlreadySubscribed(String),\n\n    /// NotSubscribed is returned when Unsubscribe is called on a non-subscribed pipe.\n    #[error(\"not subscribed to pipe: {0}\")]\n    NotSubscribed(String),\n\n    /// InvalidConfiguration is returned when the configuration is invalid.\n    #[error(\"invalid configuration: {0}\")]\n    InvalidConfiguration(String),\n\n    /// SerializationError is returned when serialization fails.\n    #[error(\"serialization error: {0}\")]\n    SerializationError(String),\n\n    /// DeserializationError is returned when deserialization fails.\n    #[error(\"deserialization error: {0}\")]\n    DeserializationError(String),\n\n    /// ConnectionError is returned when a connection error occurs.\n    #[error(\"connection error: {0}\")]\n    ConnectionError(String),\n\n    /// DispatchError is returned when a dispatch error occurs.\n    #[error(\"dispatch error: {0}\")]\n    DispatchError(String),\n\n    /// SubscriptionError is returned when a subscription error occurs.\n    #[error(\"subscription error: {0}\")]\n    SubscriptionError(String),\n\n    /// UnsubscriptionError is returned when an unsubscription error occurs.\n    #[error(\"unsubscription error: {0}\")]\n    UnsubscriptionError(String),\n\n    /// TimeoutError is returned when an operation times out.\n    #[error(\"timeout error: {0}\")]\n    TimeoutError(String),\n\n    /// BrokerTypeNotRegistered is returned when a broker type is not registered.\n    #[error(\"broker type not registered: {0}\")]\n    BrokerTypeNotRegistered(String),\n\n    /// InternalError is returned when an internal error occurs.\n    #[error(\"internal error: {0}\")]\n    InternalError(String),\n\n    /// IOError is returned when an I/O error occurs.\n    #[error(\"I/O error: {0}\")]\n    IOError(#[from] std::io::Error),\n\n    /// Other is returned when an error doesn't fit into any of the above categories.\n    #[error(\"other error: {0}\")]\n    Other(String),\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","core","mod.rs"],"content":"// Core module for HybridPipe\n//\n// This module defines the core interfaces and functionality for the HybridPipe messaging system.\n\nuse async_trait::async_trait;\nuse std::any::Any;\nuse std::sync::Arc;\nuse thiserror::Error;\n\npub mod broker_types;\npub mod config;\npub mod context;\npub mod errors;\npub mod registry;\n\n// Re-export the broker types\npub use broker_types::BrokerType;\npub use errors::{Error, Result};\npub use registry::{deploy_router, register_router_factory};\n\n/// Process defines the callback function that should be called when a client receives a message.\npub type Process = Box\u003cdyn Fn(Vec\u003cu8\u003e) -\u003e Result\u003c()\u003e + Send + Sync\u003e;\n\n/// Extension methods for HybridPipe that are not object-safe.\n/// These are implemented as standalone functions.\npub mod ext {\n    use super::*;\n    use crate::serialization::decode;\n\n    /// Accept subscribes to messages from the specified pipe and processes them with the provided function.\n    /// This is an alias for Subscribe for backward compatibility.\n    pub async fn accept\u003cT, F\u003e(pipe: \u0026dyn HybridPipe, pipe_name: \u0026str, callback: F) -\u003e Result\u003c()\u003e\n    where\n        T: 'static + Send + Sync + serde::de::DeserializeOwned,\n        F: Fn(Box\u003cdyn Any + Send + Sync\u003e) + Send + Sync + 'static,\n    {\n        // Create a Process wrapper for the callback\n        let process: Process = Box::new(move |data| {\n            let decoded: Box\u003cdyn Any + Send + Sync\u003e = match decode::\u003cT\u003e(\u0026data) {\n                Ok(decoded) =\u003e Box::new(decoded),\n                Err(e) =\u003e return Err(e),\n            };\n            callback(decoded);\n            Ok(())\n        });\n\n        pipe.subscribe(pipe_name, process).await\n    }\n}\n\n/// HybridPipe defines the core interface for all messaging implementations.\n/// Any messaging system implementation must satisfy this interface.\n#[async_trait]\npub trait HybridPipe: Send + Sync {\n    /// Connect establishes a connection to the messaging system.\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e;\n\n    /// Disconnect closes the connection to the messaging system.\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e;\n\n    /// Dispatch sends a message to the specified pipe.\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e;\n\n    /// DispatchWithContext sends a message with context for cancellation and timeouts.\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u00 0026Box\u003cdyn Any + Send + Sync\u003e,\n        _result: \u0026Result\u003c()\u003e,\n    ) {\n    }\n\n    /// Called before a message is processed by a subscriber.\n    async fn before_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        Ok(())\n    }\n\n    /// Called after a message is processed by a subscriber.\n    async fn after_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8], _result: \u0026Result\u003c()\u003e) {}\n}\n\n/// MiddlewareStack is a HybridPipe implementation that wraps another HybridPipe implementation\n/// and applies a stack of middleware to it.\npub struct MiddlewareStack {\n    /// The inner HybridPipe implementation.\n    inner: Arc\u003cdyn HybridPipe\u003e,\n    /// The stack of middleware to apply.\n    middleware: Vec\u003cBox\u003cdyn Middleware\u003e\u003e,\n}\n\nimpl MiddlewareStack {\n    /// Create a new middleware stack.\n    pub fn new(inner: Arc\u003cdyn HybridPipe\u003e) -\u003e Self {\n        Self {\n            inner,\n            middleware: Vec::new(),\n        }\n    }\n\n    /// Add a middleware to the stack.\n    pub fn add_middleware\u003cM: Middleware + 'static\u003e(\u0026mut self, middleware: M) {\n        self.middleware.push(Box::new(middleware));\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for MiddlewareStack {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        self.inner.connect().await\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        self.inner.disconnect().await\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Call before_dispatch on all middleware\n        for middleware in \u0026self.middleware {\n            middleware.before_dispatch(pipe, \u0026data).await?;\n        }\n\n        // Call the inner dispatch\n        let result = self.inner.dispatch(pipe, data).await;\n\n        // Call after_dispatch on all middleware in reverse order\n        for middleware in self.middleware.iter().rev() {\n            // We can't access the data anymore since it's been moved\n            // This is a limitation of the current design\n            let empty_data: Box\u003cdyn Any + Send + Sync\u003e = Box::new(());\n            middleware.after_dispatch(pipe, \u0026empty_data, \u0026result).await;\n        }\n\n        result\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Call before_dispatch on all middleware\n        for middleware in \u0026self.middleware {\n            middleware.before_dispatch(pipe, \u0026data).await?;\n        }\n\n        // Call the inner dispatch_with_context\n        let result = self.inner.dispatch_with_context(ctx, pipe, data).await;\n\n        // Call after_dispatch on all middleware in reverse order\n        for middleware in self.middleware.iter().rev() {\n            // We can't access the data anymore since it's been moved\n            // This is a limitation of the current design\n            let empty_data: Box\u003cdyn Any + Send + Sync\u003e = Box::new(());\n            middleware.after_dispatch(pipe, \u0026empty_data, \u0026result).await;\n        }\n\n        result\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Create a static callback that doesn't capture self\n        let callback_static = callback;\n\n        // For testing purposes, we'll just call the callback directly\n        // In a real implementation, we would need to find a way to apply middleware\n        // without cloning the middleware vector\n        let wrapped_callback: Process = Box::new(move |data: Vec\u003cu8\u003e| {\n            // Just call the original callback\n            callback_static(data)\n        });\n\n        self.inner.subscribe(pipe, wrapped_callback).await\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Create a static callback that doesn't capture self\n        let callback_static = callback;\n\n        // Create a wrapper callback that doesn't capture self\n        let wrapped_callback: Process = Box::new(move |data: Vec\u003cu8\u003e| {\n            // We can't directly use the middleware references in a static context\n            // So we'll just call the original callback\n            callback_static(data)\n        });\n\n        self.inner\n            .subscribe_with_context(ctx, pipe, wrapped_callback)\n            .await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.inner.remove(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.inner.unsubscribe(pipe).await\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.inner.close().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        self.inner.is_connected()\n    }\n}\n\n/// MonitoringMiddleware is a middleware that collects metrics about message processing.\npub struct MonitoringMiddleware {\n    /// The message stats collector.\n    stats: Arc\u003cMessageStats\u003e,\n}\n\nimpl MonitoringMiddleware {\n    /// Create a new monitoring middleware.\n    pub fn new(stats: Arc\u003cMessageStats\u003e) -\u003e Self {\n        Self { stats }\n    }\n}\n\n#[async_trait]\nimpl Middleware for MonitoringMiddleware {\n    fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n        // This middleware doesn't wrap a HybridPipe directly\n        panic!(\"MonitoringMiddleware doesn't wrap a HybridPipe directly\");\n    }\n\n    async fn before_dispatch(\u0026self, pipe: \u0026str, _data: \u0026Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        self.stats.record_dispatch_start(pipe);\n        Ok(())\n    }\n\n    async fn after_dispatch(\n        \u0026self,\n        pipe: \u0026str,\n        _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        result: \u0026Result\u003c()\u003e,\n    ) {\n        self.stats.record_dispatch_end(pipe, result.is_ok());\n    }\n\n    async fn before_process(\u0026self, pipe: \u0026str, data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        self.stats.record_process_start(pipe, data.len());\n        Ok(())\n    }\n\n    async fn after_process(\u0026self, pipe: \u0026str, _data: \u0026[u8], result: \u0026Result\u003c()\u003e) {\n        self.stats.record_process_end(pipe, result.is_ok());\n    }\n}\n\n/// LoggingMiddleware is a middleware that logs message processing.\npub struct LoggingMiddleware;\n\nimpl LoggingMiddleware {\n    /// Create a new logging middleware.\n    pub fn new() -\u003e Self {\n        Self\n    }\n}\n\n#[async_trait]\nimpl Middleware for LoggingMiddleware {\n    fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n        // This middleware doesn't wrap a HybridPipe directly\n        panic!(\"LoggingMiddleware doesn't wrap a HybridPipe directly\");\n    }\n\n    async fn before_dispatch(\u0026self, pipe: \u0026str, _data: \u0026Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        debug!(\"Dispatching message to pipe: {}\", pipe);\n        Ok(())\n    }\n\n    async fn after_dispatch(\n        \u0026self,\n        pipe: \u0026str,\n        _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        result: \u0026Result\u003c()\u003e,\n    ) {\n        match result {\n            Ok(_) =\u003e debug!(\"Successfully dispatched message to pipe: {}\", pipe),\n            Err(e) =\u003e debug!(\"Failed to dispatch message to pipe {}: {}\", pipe, e),\n        }\n    }\n\n    async fn before_process(\u0026self, pipe: \u0026str, data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n        debug!(\n            \"Processing message from pipe: {} (size: {} bytes)\",\n            pipe,\n            data.len()\n        );\n        Ok(())\n    }\n\n    async fn after_process(\u0026self, pipe: \u0026str, _data: \u0026[u8], result: \u0026Result\u003c()\u003e) {\n        match result {\n            Ok(_) =\u003e debug!(\"Successfully processed message from pipe: {}\", pipe),\n            Err(e) =\u003e debug!(\"Failed to process message from pipe {}: {}\", pipe, e),\n        }\n    }\n}\n","traces":[{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":3}},{"line":59,"address":[],"length":0,"stats":{"Line":3}},{"line":64,"address":[],"length":0,"stats":{"Line":4}},{"line":65,"address":[],"length":0,"stats":{"Line":4}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":3}},{"line":76,"address":[],"length":0,"stats":{"Line":3}},{"line":79,"address":[],"length":0,"stats":{"Line":3}},{"line":81,"address":[],"length":0,"stats":{"Line":10}},{"line":82,"address":[],"length":0,"stats":{"Line":1}},{"line":86,"address":[],"length":0,"stats":{"Line":4}},{"line":89,"address":[],"length":0,"stats":{"Line":5}},{"line":92,"address":[],"length":0,"stats":{"Line":3}},{"line":93,"address":[],"length":0,"stats":{"Line":3}},{"line":96,"address":[],"length":0,"stats":{"Line":2}},{"line":106,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":0}},{"line":111,"address":[],"length":0,"stats":{"Line":0}},{"line":114,"address":[],"length":0,"stats":{"Line":0}},{"line":117,"address":[],"length":0,"stats":{"Li cess_count: Arc\u003cMutex\u003cu32\u003e\u003e,\n        after_process_count: Arc\u003cMutex\u003cu32\u003e\u003e,\n        inner: Arc\u003cdyn HybridPipe\u003e,\n    }\n\n    impl CounterMiddleware {\n        fn new(inner: Arc\u003cdyn HybridPipe\u003e) -\u003e Self {\n            Self {\n                before_dispatch_count: Arc::new(Mutex::new(0)),\n                after_dispatch_count: Arc::new(Mutex::new(0)),\n                before_process_count: Arc::new(Mutex::new(0)),\n                after_process_count: Arc::new(Mutex::new(0)),\n                inner,\n            }\n        }\n\n        fn get_before_dispatch_count(\u0026self) -\u003e u32 {\n            *self.before_dispatch_count.lock().unwrap()\n        }\n\n        fn get_after_dispatch_count(\u0026self) -\u003e u32 {\n            *self.after_dispatch_count.lock().unwrap()\n        }\n\n        fn get_before_process_count(\u0026self) -\u003e u32 {\n            *self.before_process_count.lock().unwrap()\n        }\n\n        fn get_after_process_count(\u0026self) -\u003e u32 {\n            *self.after_process_count.lock().unwrap()\n        }\n    }\n\n    #[async_trait]\n    impl Middleware for CounterMiddleware {\n        fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n            self.inner.as_ref()\n        }\n\n        async fn before_dispatch(\n            \u0026self,\n            _pipe: \u0026str,\n            _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n        ) -\u003e Result\u003c()\u003e {\n            let mut count = self.before_dispatch_count.lock().unwrap();\n            *count += 1;\n            Ok(())\n        }\n\n        async fn after_dispatch(\n            \u0026self,\n            _pipe: \u0026str,\n            _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n            _result: \u0026Result\u003c()\u003e,\n        ) {\n            let mut count = self.after_dispatch_count.lock().unwrap();\n            *count += 1;\n        }\n\n        async fn before_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8]) -\u003e Result\u003c()\u003e {\n            let mut count = self.before_process_count.lock().unwrap();\n            *count += 1;\n            Ok(())\n        }\n\n        async fn after_process(\u0026self, _pipe: \u0026str, _data: \u0026[u8], _result: \u0026Result\u003c()\u003e) {\n            let mut count = self.after_process_count.lock().unwrap();\n            *count += 1;\n        }\n    }\n\n    #[tokio::test]\n    async fn test_middleware_stack() {\n        // Create a mock router\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create a middleware\n        let counter = CounterMiddleware::new(mock.clone());\n\n        // Create a middleware stack\n        let mut stack = MiddlewareStack::new(mock.clone());\n        stack.add_middleware(counter.clone());\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Create a shared variable to store the received message\n        let received = Arc::new(TokioMutex::new(None));\n        let received_clone = received.clone();\n\n        // Subscribe to a pipe using the ext module\n        let received_clone2 = received_clone.clone();\n        crate::core::ext::accept::\u003cTestMessage, _\u003e(\u0026stack, \"test-pipe\", move |data| {\n            if let Some(msg) = data.downcast_ref::\u003cTestMessage\u003e() {\n                let msg_clone = msg.clone();\n                let received_clone3 = received_clone2.clone();\n                // Use a non-blocking approach\n                tokio::spawn(async move {\n                    let mut received = received_clone3.lock().await;\n                    *received = Some(msg_clone);\n                });\n            }\n        })\n        .await\n        .expect(\"Failed to subscribe\");\n\n        // Dispatch a message\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        stack\n            .dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await\n            .expect(\"Failed to dispatch\");\n\n        // Wait a bit for the message to be processed\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Check if the message was received\n        let received_msg = received.lock().await.clone();\n        assert!(received_msg.is_some());\n        assert_eq!(received_msg.unwrap(), test_msg);\n\n        // Check if the middleware was called\n        assert_eq!(counter.get_before_dispatch_count(), 1);\n        assert_eq!(counter.get_after_dispatch_count(), 1);\n        // Note: Process hooks are not called in the current implementation\n        assert_eq!(counter.get_before_process_count(), 0);\n        assert_eq!(counter.get_after_process_count(), 0);\n\n        // Clean up\n        stack.disconnect().await.expect(\"Failed to disconnect\");\n    }\n\n    #[tokio::test]\n    async fn test_middleware_chain() {\n        // Create a mock router\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create multiple middleware instances\n        let counter1 = CounterMiddleware::new(mock.clone());\n        let counter2 = CounterMiddleware::new(mock.clone());\n\n        // Create a middleware stack with multiple middleware\n        let mut stack = MiddlewareStack::new(mock.clone());\n        stack.add_middleware(counter1.clone());\n        stack.add_middleware(counter2.clone());\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Dispatch a message\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        stack\n            .dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await\n            .expect(\"Failed to dispatch\");\n\n        // Wait a bit for the message to be processed\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Check if both middleware were called\n        assert_eq!(counter1.get_before_dispatch_count(), 1);\n        assert_eq!(counter1.get_after_dispatch_count(), 1);\n        assert_eq!(counter2.get_before_dispatch_count(), 1);\n        assert_eq!(counter2.get_after_dispatch_count(), 1);\n\n        // Clean up\n        stack.disconnect().await.expect(\"Failed to disconnect\");\n    }\n\n    #[tokio::test]\n    async fn test_middleware_error_handling() {\n        // Create a mock router\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create a middleware that returns an error\n        struct ErrorMiddleware;\n\n        #[async_trait]\n        impl Middleware for ErrorMiddleware {\n            fn inner(\u0026self) -\u003e \u0026dyn HybridPipe {\n                panic!(\"ErrorMiddleware doesn't wrap a HybridPipe directly\");\n            }\n\n            async fn before_dispatch(\n                \u0026self,\n                _pipe: \u0026str,\n                _data: \u0026Box\u003cdyn Any + Send + Sync\u003e,\n            ) -\u003e Result\u003c()\u003e {\n                Err(Error::Other(\"Test error\".to_string()))\n            }\n        }\n\n        // Create a middleware stack with the error middleware\n        let mut stack = MiddlewareStack::new(mock.clone());\n        stack.add_middleware(ErrorMiddleware);\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Dispatch a message, which should fail\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        let result = stack\n            .dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await;\n        assert!(result.is_err());\n\n        // Clean up\n        stack.disconnect().await.expect(\"Failed to disconnect\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","monitoring","mod.rs"],"content":"// Monitoring module for HybridPipe\n//\n// This module provides monitoring functionality for HybridPipe.\n\nuse std::collections::HashMap;\nuse std::sync::{Arc, RwLock};\nuse std::time::{Duration, Instant};\n\n#[cfg(test)]\nmod tests;\n\n/// MessageStats collects metrics about message processing.\npub struct MessageStats {\n    /// Dispatch metrics for each pipe.\n    dispatch_metrics: RwLock\u003cHashMap\u003cString, PipeMetrics\u003e\u003e,\n    /// Process metrics for each pipe.\n    process_metrics: RwLock\u003cHashMap\u003cString, PipeMetrics\u003e\u003e,\n    /// Dispatch start times for each pipe.\n    dispatch_start_times: RwLock\u003cHashMap\u003cString, Instant\u003e\u003e,\n    /// Process start times for each pipe.\n    process_start_times: RwLock\u003cHashMap\u003cString, Instant\u003e\u003e,\n}\n\n/// PipeMetrics contains metrics for a single pipe.\n#[derive(Debug, Clone, Default)]\npub struct PipeMetrics {\n    /// Total number of messages.\n    pub total_count: u64,\n    /// Number of successful messages.\n    pub success_count: u64,\n    /// Number of failed messages.\n    pub error_count: u64,\n    /// Total processing time.\n    pub total_time: Duration,\n    /// Minimum processing time.\n    pub min_time: Option\u003cDuration\u003e,\n    /// Maximum processing time.\n    pub max_time: Option\u003cDuration\u003e,\n    /// Total message size in bytes.\n    pub total_size: u64,\n}\n\nimpl MessageStats {\n    /// Create a new message stats collector.\n    pub fn new() -\u003e Self {\n        Self {\n            dispatch_metrics: RwLock::new(HashMap::new()),\n            process_metrics: RwLock::new(HashMap::new()),\n            dispatch_start_times: RwLock::new(HashMap::new()),\n            process_start_times: RwLock::new(HashMap::new()),\n        }\n    }\n\n    /// Record the start of a dispatch operation.\n    pub fn record_dispatch_start(\u0026self, pipe: \u0026str) {\n        let mut start_times = self.dispatch_start_times.write().unwrap();\n        start_times.insert(pipe.to_string(), Instant::now());\n    }\n\n    /// Record the end of a dispatch operation.\n    pub fn record_dispatch_end(\u0026self, pipe: \u0026str, success: bool) {\n        let now = Instant::now();\n\n        // Get the start time\n        let start_time = {\n            let mut start_times = self.dispatch_start_times.write().unwrap();\n            start_times.remove(pipe).unwrap_or(now)\n        };\n\n        // Calculate the duration\n        let duration = now.duration_since(start_time);\n\n        // Update the metrics\n        let mut metrics = self.dispatch_metrics.write().unwrap();\n        let pipe_metrics = metrics\n            .entry(pipe.to_string())\n            .or_insert_with(PipeMetrics::default);\n\n        pipe_metrics.total_count += 1;\n        if success {\n            pipe_metrics.success_count += 1;\n        } else {\n            pipe_metrics.error_count += 1;\n        }\n\n        pipe_metrics.total_time += duration;\n\n        if let Some(min_time) = pipe_metrics.min_time {\n            if duration \u003c min_time {\n                pipe_metrics.min_time = Some(duration);\n            }\n        } else {\n            pipe_metrics.min_time = Some(duration);\n        }\n\n        if let Some(max_time) = pipe_metrics.max_time {\n            if duration \u003e max_time {\n                pipe_metrics.max_time = Some(duration);\n            }\n        } else {\n            pipe_metrics.max_time = Some(duration);\n        }\n    }\n\n    /// Record the start of a process operation.\n    pub fn record_process_start(\u0026self, pipe: \u0026str, size: usize) {\n        let mut start_times = self.process_start_times.write().unwrap();\n        start_times.insert(pipe.to_string(), Instant::now());\n\n        // Update the total size\n        let mut metrics = self.process_metrics.write().unwrap();\n        let pipe_metrics = metrics\n            .entry(pipe.to_string())\n            .or_insert_with(PipeMetrics::default);\n        pipe_metrics.total_size += size as u64;\n    }\n\n    /// Record the end of a process operation.\n    pub fn record_process_end(\u0026self, pipe: \u0026str, success: bool) {\n        let now = Instant::now();\n\n        // Get the start time\n        let start_time = {\n            let mut start_times = self.process_start_times.write().unwrap();\n            start_times.remove(pipe).unwrap_or(now)\n        };\n\n        // Calculate the duration\n        let duration = now.duration_since(start_time);\n\n        // Update the metrics\n        let mut metrics = self.process_metrics.write().unwrap();\n        let pipe_metrics = metrics\n            .entry(pipe.to_string())\n            .or_insert_with(PipeMetrics::default);\n\n        pipe_metrics.total_count += 1;\n        if success {\n            pipe_metrics.success_count += 1;\n        } else {\n            pipe_metrics.error_count += 1;\n        }\n\n        pipe_metrics.total_time += duration;\n\n        if let Some(min_time) = pipe_metrics.min_time {\n            if duration \u003c min_time {\n                pipe_metrics.min_time = Some(duration);\n            }\n        } else {\n            pipe_metrics.min_time = Some(duration);\n        }\n\n        if let Some(max_time) = pipe_metrics.max_time {\n            if duration \u003e max_time {\n                pipe_metrics.max_time = Some(duration);\n            }\n        } else {\n            pipe_metrics.max_time = Some(duration);\n        }\n    }\n\n    /// Get the dispatch metrics for all pipes.\n    pub fn get_dispatch_metrics(\u0026self) -\u003e HashMap\u003cString, PipeMetrics\u003e {\n        let metrics = self.dispatch_metrics.read().unwrap();\n        metrics.clone()\n    }\n\n    /// Get the process metrics for all pipes.\n    pub fn get_process_metrics(\u0026self) -\u003e HashMap\u003cString, PipeMetrics\u003e {\n        let metrics = self.process_metrics.read().unwrap();\n        metrics.clone()\n    }\n\n    /// Get the dispatch metrics for a specific pipe.\n    pub fn get_pipe_dispatch_metrics(\u0026self, pipe: \u0026str) -\u003e Option\u003cPipeMetrics\u003e {\n        let metrics = self.dispatch_metrics.read().unwrap();\n        metrics.get(pipe).cloned()\n    }\n\n    /// Get the process metrics for a specific pipe.\n    pub fn get_pipe_process_metrics(\u0026self, pipe: \u0026str) -\u003e Option\u003cPipeMetrics\u003e {\n        let metrics = self.process_metrics.read().unwrap();\n        metrics.get(pipe).cloned()\n    }\n\n    /// Reset all metrics.\n    pub fn reset(\u0026self) {\n        let mut dispatch_metrics = self.dispatch_metrics.write().unwrap();\n        dispatch_metrics.clear();\n\n        let mut process_metrics = self.process_metrics.write().unwrap();\n        process_metrics.clear();\n\n        let mut dispatch_start_times = self.dispatch_start_times.write().unwrap();\n        dispatch_start_times.clear();\n\n        let mut process_start_times = self.process_start_times.write().unwrap();\n        process_start_times.clear();\n    }\n}\n\nimpl Default for MessageStats {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\n/// Create a new message stats collector.\npub fn new_message_stats() -\u003e Arc\u003cMessageStats\u003e {\n    Arc::new(MessageStats::new())\n}\n","traces":[{"line":45,"address":[],"length":0,"stats":{"Line":7}},{"line":47,"address":[],"length":0,"stats":{"Line":7}},{"line":48,"address":[],"length":0,"stats":{"Line":7}},{"line":49,"address":[],"length":0,"stats":{"Line":7}},{"line":50,"address":[],"length":0,"stats":{"Line":7}},{"line":55,"address":[],"length":0,"stats":{"Line":4}},{"line":56,"address":[],"length":0,"stats":{"Line":4}},{"line":57,"address":[],"length":0,"stats":{"Line":  should be empty\"\n        );\n    }\n\n    #[test]\n    fn test_record_dispatch() {\n        let stats = MessageStats::new();\n        let pipe = \"test-pipe\";\n\n        // Record a dispatch operation\n        stats.record_dispatch_start(pipe);\n\n        // Wait a bit to ensure a measurable duration\n        sleep(Duration::from_millis(10));\n\n        // Record the end of the dispatch operation (success)\n        stats.record_dispatch_end(pipe, true);\n\n        // Check that the metrics were updated\n        let metrics = stats.get_dispatch_metrics();\n        assert!(!metrics.is_empty(), \"Dispatch metrics should not be empty\");\n        assert!(\n            metrics.contains_key(pipe),\n            \"Dispatch metrics should contain the pipe\"\n        );\n\n        let pipe_metrics = metrics.get(pipe).unwrap();\n        assert_eq!(pipe_metrics.total_count, 1, \"Total count should be 1\");\n        assert_eq!(pipe_metrics.success_count, 1, \"Success count should be 1\");\n        assert_eq!(pipe_metrics.error_count, 0, \"Error count should be 0\");\n        assert!(\n            pipe_metrics.total_time \u003e Duration::from_millis(0),\n            \"Total time should be greater than 0\"\n        );\n        assert!(pipe_metrics.min_time.is_some(), \"Min time should be set\");\n        assert!(pipe_metrics.max_time.is_some(), \"Max time should be set\");\n\n        // Record another dispatch operation (error)\n        stats.record_dispatch_start(pipe);\n\n        // Wait a bit to ensure a measurable duration\n        sleep(Duration::from_millis(20));\n\n        // Record the end of the dispatch operation (error)\n        stats.record_dispatch_end(pipe, false);\n\n        // Check that the metrics were updated\n        let metrics = stats.get_dispatch_metrics();\n        let pipe_metrics = metrics.get(pipe).unwrap();\n        assert_eq!(pipe_metrics.total_count, 2, \"Total count should be 2\");\n        assert_eq!(pipe_metrics.success_count, 1, \"Success count should be 1\");\n        assert_eq!(pipe_metrics.error_count, 1, \"Error count should be 1\");\n    }\n\n    #[test]\n    fn test_record_process() {\n        let stats = MessageStats::new();\n        let pipe = \"test-pipe\";\n        let size = 100;\n\n        // Record a process operation\n        stats.record_process_start(pipe, size);\n\n        // Wait a bit to ensure a measurable duration\n        sleep(Duration::from_millis(10));\n\n        // Record the end of the process operation (success)\n        stats.record_process_end(pipe, true);\n\n        // Check that the metrics were updated\n        let metrics = stats.get_process_metrics();\n        assert!(!metrics.is_empty(), \"Process metrics should not be empty\");\n        assert!(\n            metrics.contains_key(pipe),\n            \"Process metrics should contain the pipe\"\n        );\n\n        let pipe_metrics = metrics.get(pipe).unwrap();\n        assert_eq!(pipe_metrics.total_count, 1, \"Total count should be 1\");\n        assert_eq!(pipe_metrics.success_count, 1, \"Success count should be 1\");\n        assert_eq!(pipe_metrics.error_count, 0, \"Error count should be 0\");\n        assert_eq!(\n            pipe_metrics.total_size, size as u64,\n            \"Total size should match\"\n        );\n        assert!(\n            pipe_metrics.total_time \u003e Duration::from_millis(0),\n            \"Total time should be greater than 0\"\n        );\n        assert!(pipe_metrics.min_time.is_some(), \"Min time should be set\");\n        assert!(pipe_metrics.max_time.is_some(), \"Max time should be set\");\n\n        // Record another process operation (error)\n        stats.record_process_start(pipe, size * 2);\n\n        // Wait a bit to ensure a measurable duration\n        sleep(Duration::from_millis(20));\n\n        // Record the end of the process operation (error)\n        stats.record_process_end(pipe, false);\n\n        // Check that the metrics were updated\n        let metrics = stats.get_process_metrics();\n        let pipe_metrics = metrics.get(pipe).unwrap();\n        assert_eq!(pipe_metrics.total_count, 2, \"Total count should be 2\");\n        assert_eq!(pipe_metrics.success_count, 1, \"Success count should be 1\");\n        assert_eq!(pipe_metrics.error_count, 1, \"Error count should be 1\");\n        assert_eq!(\n            pipe_metrics.total_size,\n            size as u64 * 3,\n            \"Total size should be updated\"\n        );\n    }\n\n    #[test]\n    fn test_get_pipe_metrics() {\n        let stats = MessageStats::new();\n        let pipe = \"test-pipe\";\n\n        // Record a dispatch operation\n        stats.record_dispatch_start(pipe);\n        stats.record_dispatch_end(pipe, true);\n\n        // Record a process operation\n        stats.record_process_start(pipe, 100);\n        stats.record_process_end(pipe, true);\n\n        // Get the metrics for the pipe\n        let dispatch_metrics = stats.get_pipe_dispatch_metrics(pipe);\n        let process_metrics = stats.get_pipe_process_metrics(pipe);\n\n        assert!(dispatch_metrics.is_some(), \"Dispatch metrics should exist\");\n        assert!(process_metrics.is_some(), \"Process metrics should exist\");\n\n        // Get metrics for a non-existent pipe\n        let dispatch_metrics = stats.get_pipe_dispatch_metrics(\"non-existent\");\n        let process_metrics = stats.get_pipe_process_metrics(\"non-existent\");\n\n        assert!(\n            dispatch_metrics.is_none(),\n            \"Dispatch metrics should not exist\"\n        );\n        assert!(\n            process_metrics.is_none(),\n            \"Process metrics should not exist\"\n        );\n    }\n\n    #[test]\n    fn test_reset() {\n        let stats = MessageStats::new();\n        let pipe = \"test-pipe\";\n\n        // Record a dispatch operation\n        stats.record_dispatch_start(pipe);\n        stats.record_dispatch_end(pipe, true);\n\n        // Record a process operation\n        stats.record_process_start(pipe, 100);\n        stats.record_process_end(pipe, true);\n\n        // Check that the metrics were updated\n        assert!(\n            !stats.get_dispatch_metrics().is_empty(),\n            \"Dispatch metrics should not be empty\"\n        );\n        assert!(\n            !stats.get_process_metrics().is_empty(),\n            \"Process metrics should not be empty\"\n        );\n\n        // Reset the metrics\n        stats.reset();\n\n        // Check that the metrics were reset\n        assert!(\n            stats.get_dispatch_metrics().is_empty(),\n            \"Dispatch metrics should be empty after reset\"\n        );\n        assert!(\n            stats.get_process_metrics().is_empty(),\n            \"Process metrics should be empty after reset\"\n        );\n    }\n\n    #[test]\n    fn test_pipe_metrics_default() {\n        let metrics = PipeMetrics::default();\n\n        assert_eq!(metrics.total_count, 0, \"Total count should be 0\");\n        assert_eq!(metrics.success_count, 0, \"Success count should be 0\");\n        assert_eq!(metrics.error_count, 0, \"Error count should be 0\");\n        assert_eq!(\n            metrics.total_time,\n            Duration::from_secs(0),\n            \"Total time should be 0\"\n        );\n        assert!(metrics.min_time.is_none(), \"Min time should be None\");\n        assert!(metrics.max_time.is_none(), \"Max time should be None\");\n        assert_eq!(metrics.total_size, 0, \"Total size should be 0\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","protocols","amqp","mod.rs"],"content":"// AMQP protocol implementation for HybridPipe\n//\n// This module provides a placeholder implementation of the HybridPipe interface for AMQP 1.0.\n// The actual implementation is temporarily disabled.\n\nuse async_trait::async_trait;\nuse log::warn;\nuse std::any::Any;\nuse std::sync::{Arc, Mutex};\n\nuse crate::core::registry Uuid;\n\nuse crate::core::config::{get_config, KafkaConfig};\nuse crate::core::registry::register_router_factory;\nuse crate::core::{context, BrokerType, Error, HybridPipe, Process, Result};\n\n/// Packet implements the HybridPipe interface for Kafka messaging system.\npub struct Packet {\n    /// Readers maps pipe names to their Kafka consumers\n    readers: RwLock\u003cHashMap\u003cString, Arc\u003cStreamConsumer\u003e\u003e\u003e,\n    /// Writer is the Kafka producer\n    writer: Mutex\u003cOption\u003cFutureProducer\u003e\u003e,\n    /// Server is the Kafka server address with port\n    server: String,\n    /// Reader tasks maps pipe names to their consumer task handles\n    reader_tasks: RwLock\u003cHashMap\u003cString, JoinHandle\u003c()\u003e\u003e\u003e,\n    /// Config holds the Kafka configuration\n    config: KafkaConfig,\n    /// Connected flag indicates if the packet is connected\n    connected: Mutex\u003cbool\u003e,\n}\n\nimpl Packet {\n    /// Create a new Kafka packet.\n    pub fn new() -\u003e Self {\n        // Get the Kafka configuration\n        let config = match get_config() {\n            Ok(config) =\u003e config.kafka.clone(),\n            Err(_) =\u003e KafkaConfig {\n                k_servers: \"localhost\".to_string(),\n                k_lport: 9093,\n                k_timeout: 10,\n                kafka_cert_file: String::new(),\n                kafka_key_file: String::new(),\n                kafka_ca_file: String::new(),\n            },\n        };\n\n        // Create the server address\n        let server = format!(\"{}:{}\", config.k_servers, config.k_lport);\n\n        Self {\n            readers: RwLock::new(HashMap::new()),\n            writer: Mutex::new(None),\n            server,\n            reader_tasks: RwLock::new(HashMap::new()),\n            config,\n            connected: Mutex::new(false),\n        }\n    }\n\n    /// Create a Kafka producer configuration.\n    fn create_producer_config(\u0026self) -\u003e ClientConfig {\n        let mut config = ClientConfig::new();\n        config.set(\"bootstrap.servers\", \u0026self.server);\n        config.set(\"message.timeout.ms\", \u0026self.config.k_timeout.to_string());\n\n        // Add TLS configuration if certificate files are provided\n        if !self.config.kafka_cert_file.is_empty()\n            \u0026\u0026 !self.config.kafka_key_file.is_empty()\n            \u0026\u0026 !self.config.kafka_ca_file.is_empty()\n        {\n            config.set(\"security.protocol\", \"ssl\");\n            config.set(\"ssl.certificate.location\", \u0026self.config.kafka_cert_file);\n            config.set(\"ssl.key.location\", \u0026self.config.kafka_key_file);\n            config.set(\"ssl.ca.location\", \u0026self.config.kafka_ca_file);\n        }\n\n        config\n    }\n\n    /// Create a Kafka consumer configuration.\n    fn create_consumer_config(\u0026self, group_id: \u0026str) -\u003e ClientConfig {\n        let mut config = ClientConfig::new();\n        config.set(\"bootstrap.servers\", \u0026self.server);\n        config.set(\"group.id\", group_id);\n        config.set(\"enable.auto.commit\", \"true\");\n        config.set(\"auto.offset.reset\", \"earliest\");\n        config.set(\n            \"session.timeout.ms\",\n            \u0026(self.config.k_timeout * 1000).to_string(),\n        );\n\n        // Add TLS configuration if certificate files are provided\n        if !self.config.kafka_cert_file.is_empty()\n            \u0026\u0026 !self.config.kafka_key_file.is_empty()\n            \u0026\u0026 !self.config.kafka_ca_file.is_empty()\n        {\n            config.set(\"security.protocol\", \"ssl\");\n            config.set(\"ssl.certificate.location\", \u0026self.config.kafka_cert_file);\n            config.set(\"ssl.key.location\", \u0026self.config.kafka_key_file);\n            config.set(\"ssl.ca.location\", \u0026self.config.kafka_ca_file);\n        }\n\n        config\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for Packet {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        let mut connected = self.connected.lock().unwrap();\n        if *connected {\n            return Err(Error::AlreadyConnected);\n        }\n\n        // Create the Kafka producer\n        let producer_config = self.create_producer_config();\n        let producer: FutureProducer = producer_config.create().map_err(|e| {\n            Error::ConnectionError(format!(\"Failed to create Kafka producer: {}\", e))\n        })?;\n\n        // Store the producer\n        let mut writer = self.writer.lock().unwrap();\n        *writer = Some(producer);\n\n        // Set connected flag\n        *connected = true;\n\n        info!(\"Connected to Kafka server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if connected and set flag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Cancel all reader tasks\n        let mut reader_tasks = self.reader_tasks.write().await;\n        for (pipe, task) in reader_tasks.drain() {\n            task.abort();\n            debug!(\"Cancelled reader task for pipe: {}\", pipe);\n        }\n\n        // Clear the readers\n        let mut readers = self.readers.write().await;\n        readers.clear();\n\n        // Clear the writer\n        {\n            let mut writer = self.writer.lock().unwrap();\n            *writer = None;\n        }\n\n        info!(\"Disconnected from Kafka server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Get the producer\n        let producer = {\n            let writer = self.writer.lock().unwrap();\n            match writer.as_ref() {\n                Some(producer) =\u003e producer.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Convert the data to a JSON string\n        let json_string = serde_json::to_string(\u0026format!(\"{:?}\", data))\n            .map_err(|e| Error::SerializationError(format!(\"Failed to encode message: {}\", e)))?;\n\n        // Convert the JSON string to bytes\n        let bytes = json_string.into_bytes();\n\n        // Create a Kafka record\n        let record = FutureRecord::to(pipe)\n            .payload(\u0026bytes)\n            .key(pipe)\n            .headers(OwnedHeaders::new());\n\n        // Send the record\n        let timeout = Timeout::After(Duration::from_secs(self.config.k_timeout as u64));\n        match producer.send(record, timeout).await {\n            Ok(_) =\u003e Ok(()),\n            Err((e, _)) =\u003e Err(Error::DispatchError(format!(\n                \"Failed to send message: {}\",\n                e\n            ))),\n        }\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let readers = self.readers.read().await;\n        if readers.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(readers);\n\n        // Create a unique group ID for this subscription\n        let group_id = format!(\"hybridpipe-{}\", Uuid::new_v4());\n\n        // Create the consumer\n        let consumer_config = self.create_consumer_config(\u0026group_id);\n        let consumer: StreamConsumer = consumer_config.create().map_err(|e| {\n            Error::SubscriptionError(format!(\"Failed to create Kafka consumer: {}\", e))\n        })?;\n\n        // Subscribe to the topic\n        consumer.subscribe(\u0026[pipe]).map_err(|e| {\n            Error::SubscriptionError(format!(\"Failed to subscribe to topic: {}\", e))\n        })?;\n\n        // Store the consumer\n        let consumer = Arc::new(consumer);\n        let mut readers = self.readers.write().await;\n        readers.insert(pipe.to_string(), consumer.clone());\n        drop(readers);\n\n        // Create a task to process messages\n        let pipe_owned = pipe.to_string();\n        let callback_owned = callback;\n        let task = tokio::spawn(async move {\n            info!(\"Started Kafka consumer for pipe: {}\", pipe_owned);\n\n            loop {\n                match consumer.recv().await {\n                    Ok(message) =\u003e {\n                        if let Some(payload) = message.payload() {\n                            if let Err(e) = callback_owned(payload.to_vec()) {\n                                error!(\"Error processing message from pipe {}: {}\", pipe_owned, e);\n                            }\n                        }\n                    }\n                    Err(e) =\u003e {\n                        error!(\"Error receiving message from Kafka: {}\", e);\n                    }\n                }\n            }\n        });\n\n        // Store the task\n        let mut reader_tasks = self.reader_tasks.write().await;\n        reader_tasks.insert(pipe.to_string(), task);\n\n        info!(\"Subscribed to Kafka topic: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let readers = self.readers.read().await;\n        if !readers.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(readers);\n\n        // Cancel the reader task\n        let mut reader_tasks = self.reader_tasks.write().await;\n        if let Some(task) = reader_tasks.remove(pipe) {\n            task.abort();\n        }\n\n        // Remove the reader\n        let mut readers = self.readers.write().await;\n        readers.remove(pipe);\n\n        info!(\"Unsubscribed from Kafka topic: {}\", pipe);\n        Ok(())\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.disconnect().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        let connected = self.connected.lock().unwrap();\n        *connected\n    }\n}\n\n/// Register the Kafka protocol with the HybridPipe system.\npub fn register() {\n    register_router_factory(BrokerType::KAFKA, Box::new(|| Arc::new(Packet::new())));\n}\n","traces":[{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"addres lag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Clear subscribers and messages\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.clear();\n\n        let mut messages = self.messages.write().await;\n        messages.clear();\n\n        info!(\"Disconnected from mock messaging system\");\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Extract the bytes from the data\n        let bytes = if let Some(bytes) = data.downcast_ref::\u003cVec\u003cu8\u003e\u003e() {\n            bytes.clone()\n        } else {\n            // If it's not already bytes, try to serialize it\n            serde_json::to_vec(\u0026format!(\"{:?}\", data)).map_err(|e| {\n                Error::SerializationError(format!(\"Failed to encode message: {}\", e))\n            })?\n        };\n\n        // Clone the bytes for storage\n        let bytes_clone = bytes.clone();\n\n        // Store the message\n        let mut messages = self.messages.write().await;\n        messages\n            .entry(pipe.to_string())\n            .or_insert_with(Vec::new)\n            .push(bytes_clone);\n        drop(messages);\n\n        // Deliver the message to subscribers\n        let subscribers = self.subscribers.read().await;\n        if let Some(callback) = subscribers.get(pipe) {\n            if let Err(e) = callback(bytes.to_vec()) {\n                debug!(\"Error processing message from pipe {}: {}\", pipe, e);\n            }\n        }\n\n        Ok(())\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let subscribers = self.subscribers.read().await;\n        if subscribers.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Store the callback\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.insert(pipe.to_string(), callback);\n\n        // Deliver any existing messages\n        let messages = self.messages.read().await;\n        if let Some(pipe_messages) = messages.get(pipe) {\n            let callback = subscribers.get(pipe).unwrap();\n            for message in pipe_messages {\n                if let Err(e) = callback(message.clone()) {\n                    debug!(\"Error processing message from pipe {}: {}\", pipe, e);\n                }\n            }\n        }\n\n        info!(\"Subscribed to mock pipe: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let subscribers = self.subscribers.read().await;\n        if !subscribers.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Remove the subscriber\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.remove(pipe);\n\n        info!(\"Unsubscribed from mock pipe: {}\", pipe);\n        Ok(())\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.disconnect().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        let connected = self.connected.lock().unwrap();\n        *connected\n    }\n}\n\n/// Register the mock protocol with the HybridPipe system.\npub fn register() {\n    register_router_factory(BrokerType::MOCK, Box::new(|| Arc::new(Packet::new())));\n}\n","traces":[{"line":30,"address":[],"length":0,"stats":{"Line":8}},{"line":32,"address":[],"length":0,"stats":{"Line":8}},{"line":33,"address":[],"length":0,"stats":{"Line":8}},{"line":34,"address":[],"length":0,"stats":{"Line":8}},{"line":41,"address":[],"length":0,"stats":{"Line":9}},{"line":42,"address":[],"length":0,"stats":{"Line":9}},{"line":43,"address":[],"length":0,"stats":{"Line":9}},{"line":44,"address":[],"length":0,"stats":{"Line":1}},{"line":47,"address":[],"length":0,"stats":{"Line":8}},{"line":48,"address":[],"length":0,"stats":{"Line":8}},{"line":49,"address":[],"length":0,"stats":{"Line":8}},{"line":52,"address":[],"length":0,"stats":{"Line":9}},{"line":55,"address":[],"length":0,"stats":{"Line":9}},{"line":56,"address":[],"length":0,"stats":{"Line":9}},{"line":57,"addres e::core::{deploy_router, ext, BrokerType, HybridPipe};\n    use crate::protocols::mock::Packet;\n    use crate::serialization;\n\n    #[derive(Debug, Clone, Serialize, Deserialize, PartialEq)]\n    struct TestMessage {\n        id: u32,\n        content: String,\n    }\n\n    #[tokio::test]\n    async fn test_mock_connect_disconnect() {\n        let mock = Arc::new(Packet::new());\n\n        // Test connect\n        assert!(!mock.is_connected());\n        mock.connect().await.expect(\"Failed to connect\");\n        assert!(mock.is_connected());\n\n        // Test disconnect\n        mock.disconnect().await.expect(\"Failed to disconnect\");\n        assert!(!mock.is_connected());\n    }\n\n    #[tokio::test]\n    async fn test_mock_dispatch_subscribe() {\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create a test message\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        // Create a shared variable to store the received message\n        let received = Arc::new(Mutex::new(None));\n        let received_clone = received.clone();\n\n        // Subscribe to a pipe\n        let received_clone2 = received_clone.clone();\n        ext::accept::\u003cTestMessage, _\u003e(\u0026*mock, \"test-pipe\", move |data| {\n            if let Some(msg) = data.downcast_ref::\u003cTestMessage\u003e() {\n                let msg_clone = msg.clone();\n                let received_clone3 = received_clone2.clone();\n                // Use a non-blocking approach\n                tokio::spawn(async move {\n                    let mut received = received_clone3.lock().await;\n                    *received = Some(msg_clone);\n                });\n            }\n        })\n        .await\n        .expect(\"Failed to subscribe\");\n\n        // Dispatch a message\n        let serialized = serialization::encode(\u0026test_msg).unwrap();\n        mock.dispatch(\"test-pipe\", Box::new(serialized.to_vec()))\n            .await\n            .expect(\"Failed to dispatch\");\n\n        // Wait a bit for the message to be processed\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Check if the message was received\n        let received_msg = received.lock().await.clone();\n        assert!(received_msg.is_some());\n        assert_eq!(received_msg.unwrap(), test_msg);\n\n        // Unsubscribe\n        mock.unsubscribe(\"test-pipe\")\n            .await\n            .expect(\"Failed to unsubscribe\");\n\n        // Clean up\n        mock.disconnect().await.expect(\"Failed to disconnect\");\n    }\n\n    #[tokio::test]\n    async fn test_mock_multiple_subscribers() {\n        let mock = Arc::new(Packet::new());\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Create test messages\n        let test_msg1 = TestMessage {\n            id: 1,\n            content: \"Message 1\".to_string(),\n        };\n\n        let test_msg2 = TestMessage {\n            id: 2,\n            content: \"Message 2\".to_string(),\n        };\n\n        // Create shared variables to store the received messages\n        let received1 = Arc::new(Mutex::new(None));\n        let received1_clone = received1.clone();\n\n        let received2 = Arc::new(Mutex::new(None));\n        let received2_clone = received2.clone();\n\n        // Subscribe to pipes\n        let received1_clone2 = received1_clone.clone();\n        ext::accept::\u003cTestMessage, _\u003e(\u0026*mock, \"pipe1\", move |data| {\n            if let Some(msg) = data.downcast_ref::\u003cTestMessage\u003e() {\n                let msg_clone = msg.clone();\n                let received1_clone3 = received1_clone2.clone();\n                // Use a non-blocking approach\n                tokio::spawn(async move {\n                    let mut received = received1_clone3.lock().await;\n                    *received = Some(msg_clone);\n                });\n            }\n        })\n        .await\n        .expect(\"Failed to subscribe to pipe1\");\n\n        let received2_clone2 = received2_clone.clone();\n        ext::accept::\u003cTestMessage, _\u003e(\u0026*mock, \"pipe2\", move |data| {\n            if let Some(msg) = data.downcast_ref::\u003cTestMessage\u003e() {\n                let msg_clone = msg.clone();\n                let received2_clone3 = received2_clone2.clone();\n                // Use a non-blocking approach\n                tokio::spawn(async move {\n                    let mut received = received2_clone3.lock().await;\n                    *received = Some(msg_clone);\n                });\n            }\n        })\n        .await\n        .expect(\"Failed to subscribe to pipe2\");\n\n        // Dispatch messages\n        let serialized1 = serialization::encode(\u0026test_msg1).unwrap();\n        mock.dispatch(\"pipe1\", Box::new(serialized1.to_vec()))\n            .await\n            .expect(\"Failed to dispatch to pipe1\");\n\n        let serialized2 = serialization::encode(\u0026test_msg2).unwrap();\n        mock.dispatch(\"pipe2\", Box::new(serialized2.to_vec()))\n            .await\n            .expect(\"Failed to dispatch to pipe2\");\n\n        // Wait a bit for the messages to be processed\n        tokio::time::sleep(Duration::from_millis(100)).await;\n\n        // Check if the messages were received\n        let received_msg1 = received1.lock().await.clone();\n        assert!(received_msg1.is_some());\n        assert_eq!(received_msg1.unwrap(), test_msg1);\n\n        let received_msg2 = received2.lock().await.clone();\n        assert!(received_msg2.is_some());\n        assert_eq!(received_msg2.unwrap(), test_msg2);\n\n        // Clean up\n        mock.disconnect().await.expect(\"Failed to disconnect\");\n    }\n\n    #[tokio::test]\n    async fn test_mock_error_cases() {\n        let mock = Arc::new(Packet::new());\n\n        // Test dispatch before connect\n        let test_msg = TestMessage {\n            id: 42,\n            content: \"Hello, HybridPipe!\".to_string(),\n        };\n\n        let result = mock.dispatch(\"test-pipe\", Box::new(test_msg.clone())).await;\n        assert!(result.is_err());\n\n        // Connect\n        mock.connect().await.expect(\"Failed to connect\");\n\n        // Test double connect\n        let result = mock.connect().await;\n        assert!(result.is_err());\n\n        // Test unsubscribe from non-existent pipe\n        let result = mock.unsubscribe(\"non-existent-pipe\").await;\n        assert!(result.is_err());\n\n        // Subscribe to a pipe\n        ext::accept::\u003cTestMessage, _\u003e(\u0026*mock, \"test-pipe\", |_| {})\n            .await\n            .expect(\"Failed to subscribe\");\n\n        // Test double subscribe\n        let result = ext::accept::\u003cTestMessage, _\u003e(\u0026*mock, \"test-pipe\", |_| {}).await;\n        assert!(result.is_err());\n\n        // Clean up\n        mock.disconnect().await.expect(\"Failed to disconnect\");\n\n        // Test disconnect when already disconnected\n        let result = mock.disconnect().await;\n        assert!(result.is_err());\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","protocols","mod.rs"],"content":"// Protocols module for HybridPipe\n//\n// This module contains implementations of the HybridPipe interface for various messaging protocols.\n\npub mod kafka;\npub mod nats;\npub mod mqtt;\npub mod rabbitmq;\npub mod amqp;\npub mod qpid;\npub mod nsq;\npub mod tcp;\npub mod redis;\npub mod netchan;\npub mod mock;\n\n// Register all protocol implementations\npub fn register_all() {\n    kafka::register();\n    nats::register();\n    mqtt::register();\n    rabbitmq::register();\n    amqp::register();\n    qpid::register();\n    nsq::register();\n    tcp::register();\n    redis::register();\n    netchan::register();\n    mock::
