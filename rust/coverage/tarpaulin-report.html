,\n    /// Server is the MQTT broker address\n    server: String,\n    /// Config holds the MQTT configuration\n    config: MQTTConfig,\n    /// Connected flag indicates if the packet is connected\n    connected: Mutex\u003cbool\u003e,\n}\n\nimpl Packet {\n    /// Create a new MQTT packet.\n    pub fn new() -\u003e Self {\n        // Get the MQTT configuration\n        let config = match get_config() {\n            Ok(config) =\u003e config.mqtt.clone(),\n            Err(_) =\u003e MQTTConfig {\n                mqtt_broker: \"tcp://localhost:1883\".to_string(),\n            },\n        };\n\n        // Extract the server address from the broker URL\n        let server = config.mqtt_broker.clone();\n\n        Self {\n            client: Mutex::new(None),\n            event_loop_handle: Mutex::new(None),\n            subscribers: RwLock::new(HashMap::new()),\n            server,\n            config,\n            connected: Mutex::new(false),\n        }\n    }\n\n    /// Parse the MQTT broker URL to extract host, port, and protocol.\n    fn parse_broker_url(\u0026self) -\u003e Result\u003c(String, u16, bool)\u003e {\n        let url = \u0026self.config.mqtt_broker;\n\n        // Check if the URL starts with tcp:// or ssl://\n        let (protocol, rest) = if url.starts_with(\"tcp://\") {\n            (\"tcp\", \u0026url[6..])\n        } else if url.starts_with(\"ssl://\") {\n            (\"ssl\", \u0026url[6..])\n        } else {\n            return Err(Error::InvalidConfiguration(format!(\n                \"Invalid MQTT broker URL: {}. Must start with tcp:// or ssl://\",\n                url\n            )));\n        };\n\n        // Split the rest by : to get host and port\n        let parts: Vec\u003c\u0026str\u003e = rest.split(':').collect();\n        if parts.len() != 2 {\n            return Err(Error::InvalidConfiguration(format!(\n                \"Invalid MQTT broker URL: {}. Expected format: tcp://host:port or ssl://host:port\",\n                url\n            )));\n        }\n\n        let host = parts[0].to_string();\n        let port = parts[1]\n            .parse::\u003cu16\u003e()\n            .map_err(|e| Error::InvalidConfiguration(format!(\"Invalid MQTT port: {}\", e)))?;\n\n        let use_tls = protocol == \"ssl\";\n\n        Ok((host, port, use_tls))\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for Packet {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        let mut connected = self.connected.lock().unwrap();\n        if *connected {\n            return Err(Error::AlreadyConnected);\n        }\n\n        // Parse the broker URL\n        let (host, port, use_tls) = self.parse_broker_url()?;\n\n        // Create MQTT options\n        let mut mqtt_options = MqttOptions::new(\"hybridpipe-client\", host, port);\n\n        // Set connection options\n        mqtt_options.set_keep_alive(Duration::from_secs(30));\n        mqtt_options.set_clean_session(true);\n\n        // Set TLS if needed\n        if use_tls {\n            let tls_config = TlsConfiguration::Simple {\n                ca: Vec::new(),\n                alpn: None,\n                client_auth: None,\n            };\n            mqtt_options.set_transport(Transport::tls_with_config(tls_config));\n        }\n\n        // Create the client and event loop\n        let (client, mut event_loop) = AsyncClient::new(mqtt_options, 10);\n\n        // Store the client\n        let mut client_guard = self.client.lock().unwrap();\n        *client_guard = Some(client);\n        drop(client_guard);\n\n        // Start the event loop\n        let event_loop_handle = tokio::spawn(async move {\n            loop {\n                match event_loop.poll().await {\n                    Ok(Event::Incoming(MqttPacket::Publish(publish))) =\u003e {\n                        debug!(\"Received MQTT message on topic: {}\", publish.topic);\n                        // The subscribers will be handled separately\n                    }\n                    Ok(_) =\u003e {\n                        // Ignore other events\n                    }\n                    Err(ConnectionError::Io(e)) =\u003e {\n                        error!(\"MQTT connection error: {}\", e);\n                        break;\n                    }\n                    Err(e) =\u003e {\n                        error!(\"MQTT error: {}\", e);\n                    }\n                }\n            }\n        });\n\n        // Store the event loop handle\n        let mut handle_guard = self.event_loop_handle.lock().unwrap();\n        *handle_guard = Some(event_loop_handle);\n\n        // Set connected flag\n        *connected = true;\n\n        info!(\"Connected to MQTT broker at {}\", self.server);\n        Ok(())\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if connected and set flag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Cancel the event loop\n        {\n            let mut handle_guard = self.event_loop_handle.lock().unwrap();\n            if let Some(handle) = handle_guard.take() {\n                handle.abort();\n            }\n        }\n\n        // Get the client to disconnect\n        let client_to_disconnect = {\n            let mut client_guard = self.client.lock().unwrap();\n            client_guard.take()\n        };\n\n        // Disconnect the client if it exists\n        if let Some(client) = client_to_disconnect {\n            if let Err(e) = client.disconnect().await {\n                warn!(\"Error disconnecting from MQTT broker: {}\", e);\n            }\n        }\n\n        // Clear the subscribers\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.clear();\n\n        info!(\"Disconnected from MQTT broker at {}\", self.server);\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Get the client\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            match client_guard.as_ref() {\n                Some(client) =\u003e client.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Convert the data to a JSON string\n        let json_string = serde_json::to_string(\u0026format!(\"{:?}\", data))\n            .map_err(|e| Error::SerializationError(format!(\"Failed to encode message: {}\", e)))?;\n\n        // Convert the JSON string to bytes\n        let bytes = json_string.into_bytes();\n\n        // Publish the message\n        client\n            .publish(pipe, QoS::AtLeastOnce, false, bytes.to_vec())\n            .await\n            .map_err(|e| Error::DispatchError(format!(\"Failed to publish message: {}\", e)))?;\n\n        Ok(())\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let subscribers = self.subscribers.read().await;\n        if subscribers.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Get the client\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            match client_guard.as_ref() {\n                Some(client) =\u003e client.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Subscribe to the topic\n        client\n            .subscribe(pipe, QoS::AtLeastOnce)\n            .await\n            .map_err(|e| {\n                Error::SubscriptionError(format!(\"Failed to subscribe to topic: {}\", e))\n            })?;\n\n        // Store the callback\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.insert(pipe.to_string(), callback);\n\n        info!(\"Subscribed to MQTT topic: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let subscribers = self.subscribers.read().await;\n        if !subscribers.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Get the client\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            match client_guard.as_ref() {\n                Some(client) =\u003e client.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Unsubscribe from the topic\n        client.unsubscribe(pipe).await.map_err(|e| {\n            Error::UnsubscriptionError(format!(\"Failed to unsubscribe from topic: {}\", e))\n        })?;\n\n        // Remove the callback\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.remove(pipe);\n\n        info!(\"Unsubscribed from MQTT topic: {}\", pipe);\n        Ok(())\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.disconnect().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        let connected = self.connected.lock().unwrap();\n        *connected\n    }\n}\n\n/// Register the MQTT protocol with the HybridPipe system.\npub fn register() {\n    register_router_factory(BrokerType::MQTT, Box::new(|| Arc::new(Packet::new())));\n}\n","traces":[{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":45,"address":[],"length":0,"stats":{"Line":0}},{"line":50,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":58,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":70,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[] TS messaging system.\npub struct Packet {\n    /// Client is the NATS client\n    client: Mutex\u003cOption\u003cClient\u003e\u003e,\n    /// Subscribers maps pipe names to their subscribers\n    subscribers: RwLock\u003cHashMap\u003cString, Subscriber\u003e\u003e,\n    /// Server is the NATS server address with port\n    server: String,\n    /// Subscriber tasks maps pipe names to their subscriber task handles\n    subscriber_tasks: RwLock\u003cHashMap\u003cString, JoinHandle\u003c()\u003e\u003e\u003e,\n    /// Config holds the NATS configuration\n    config: NATSConfig,\n    /// Connected flag indicates if the packet is connected\n    connected: Mutex\u003cbool\u003e,\n}\n\nimpl Packet {\n    /// Create a new NATS packet.\n    pub fn new() -\u003e Self {\n        // Get the NATS configuration\n        let config = match get_config() {\n            Ok(config) =\u003e config.nats.clone(),\n            Err(_) =\u003e NATSConfig {\n                n_servers: \"localhost\".to_string(),\n                n_lport: 4222,\n                n_mport: 8222,\n                n_cport: 6222,\n                nats_cert_file: String::new(),\n                nats_key_file: String::new(),\n                nats_ca_file: String::new(),\n                n_allow_reconnect: true,\n                n_max_attempt: 10,\n                n_reconnect_wait: 5,\n                n_timeout: 2,\n            },\n        };\n\n        // Create the server address\n        let server = format!(\"{}:{}\", config.n_servers, config.n_lport);\n\n        Self {\n            client: Mutex::new(None),\n            subscribers: RwLock::new(HashMap::new()),\n            server,\n            subscriber_tasks: RwLock::new(HashMap::new()),\n            config,\n            connected: Mutex::new(false),\n        }\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for Packet {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if already connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if *connected {\n                return Err(Error::AlreadyConnected);\n            }\n        }\n\n        // Create NATS connection options\n        let mut options = ConnectOptions::new();\n\n        // Set connection timeout\n        options = options.connection_timeout(Duration::from_secs(self.config.n_timeout as u64));\n\n        // Set reconnect options\n        if self.config.n_allow_reconnect {\n            options = options.retry_on_initial_connect();\n            // max_reconnects is not available in the current version of async-nats\n            let reconnect_wait = self.config.n_reconnect_wait;\n            options = options.reconnect_delay_callback(move |attempts| {\n                Duration::from_secs((attempts as u64).saturating_mul(reconnect_wait as u64))\n            });\n        }\n\n        // Add TLS configuration if certificate files are provided\n        if !self.config.nats_cert_file.is_empty()\n            \u0026\u0026 !self.config.nats_key_file.is_empty()\n            \u0026\u0026 !self.config.nats_ca_file.is_empty()\n        {\n            // Load certificates\n            let cert = tokio::fs::read(\u0026self.config.nats_cert_file)\n                .await\n                .map_err(|e| {\n                    Error::ConnectionError(format!(\"Failed to read NATS certificate file: {}\", e))\n                })?;\n\n            let key = tokio::fs::read(\u0026self.config.nats_key_file)\n                .await\n                .map_err(|e| {\n                    Error::ConnectionError(format!(\"Failed to read NATS key file: {}\", e))\n                })?;\n\n            let ca = tokio::fs::read(\u0026self.config.nats_ca_file)\n                .await\n                .map_err(|e| {\n                    Error::ConnectionError(format!(\"Failed to read NATS CA file: {}\", e))\n                })?;\n\n            // Create TLS configuration\n            // The API has changed in the current version of async-nats\n            // We'll use a simplified approach\n            options = options.require_tls(true);\n\n            // Note: For proper TLS with client certificates and custom CA,\n            // we would need to use the tls_client_config method with a properly\n            // configured rustls::ClientConfig, but that's beyond the scope of this fix\n\n            // The tls_config method has been renamed to tls_client_config in the current version\n            // But we're using require_tls(true) instead for simplicity\n        }\n\n        // Connect to NATS server\n        let client = async_nats::connect_with_options(\u0026self.server, options)\n            .await\n            .map_err(|e| {\n                Error::ConnectionError(format!(\"Failed to connect to NATS server: {}\", e))\n            })?;\n\n        // Store the client\n        let mut client_guard = self.client.lock().unwrap();\n        *client_guard = Some(client);\n        drop(client_guard);\n\n        // Set connected flag\n        {\n            let mut connected = self.connected.lock().unwrap();\n            *connected = true;\n        }\n\n        info!(\"Connected to NATS server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if connected and set flag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Cancel all subscriber tasks\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        for (pipe, task) in subscriber_tasks.drain() {\n            task.abort();\n            debug!(\"Cancelled subscriber task for pipe: {}\", pipe);\n        }\n\n        // Clear the subscribers\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.clear();\n\n        // Close the client\n        {\n            let mut client_guard = self.client.lock().unwrap();\n            if let Some(client) = client_guard.take() {\n                drop(client); // This will close the connection\n            }\n        }\n\n        info!(\"Disconnected from NATS server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Get the client\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            match client_guard.as_ref() {\n                Some(client) =\u003e client.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Convert the data to a JSON string\n        let json_string = serde_json::to_string(\u0026format!(\"{:?}\", data))\n            .map_err(|e| Error::SerializationError(format!(\"Failed to encode message: {}\", e)))?;\n\n        // Convert the JSON string to bytes\n        let bytes = json_string.into_bytes();\n\n        // Publish the message\n        // Create a copy of the pipe string to avoid borrowing issues\n        let pipe_owned = pipe.to_string();\n        client\n            .publish(pipe_owned, bytes.into())\n            .await\n            .map_err(|e| Error::DispatchError(format!(\"Failed to publish message: {}\", e)))?;\n\n        Ok(())\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let subscribers = self.subscribers.read().await;\n        if subscribers.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Get the client\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            match client_guard.as_ref() {\n                Some(client) =\u003e client.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Subscribe to the subject\n        // Create a copy of the pipe string to avoid borrowing issues\n        let pipe_owned = pipe.to_string();\n        let subscriber = client.subscribe(pipe_owned).await.map_err(|e| {\n            Error::SubscriptionError(format!(\"Failed to subscribe to subject: {}\", e))\n        })?;\n\n        // In the current version of async-nats, Subscriber doesn't implement Clone\n        // We'll need to use a different approach\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.insert(pipe.to_string(), subscriber);\n\n        // Get a new subscriber for the same subject\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            match client_guard.as_ref() {\n                Some(client) =\u003e client.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Create another copy of the pipe string\n        let pipe_owned2 = pipe.to_string();\n        let mut subscriber = client.subscribe(pipe_owned2).await.map_err(|e| {\n            Error::SubscriptionError(format!(\"Failed to subscribe to subject: {}\", e))\n        })?;\n        drop(subscribers);\n\n        // Create a task to process messages\n        let pipe_owned = pipe.to_string();\n        let callback_owned = callback;\n        let task = tokio::spawn(async move {\n            info!(\"Started NATS subscriber for pipe: {}\", pipe_owned);\n\n            while let Some(msg) = subscriber.next().await {\n                if let Err(e) = callback_owned(msg.payload.to_vec()) {\n                    error!(\"Error processing message from pipe {}: {}\", pipe_owned, e);\n                }\n            }\n        });\n\n        // Store the task\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        subscriber_tasks.insert(pipe.to_string(), task);\n\n        info!(\"Subscribed to NATS subject: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let subscribers = self.subscribers.read().await;\n        if !subscribers.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Cancel the subscriber task\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        if let Some(task) = subscriber_tasks.remove(pipe) {\n er: String,\n    /// Config holds the RabbitMQ configuration\n    config: RabbitMQConfig,\n    /// Connected flag indicates if the packet is connected\n    connected: Mutex\u003cbool\u003e,\n    /// Exchange name\n    exchange: String,\n}\n\nimpl Packet {\n    /// Create a new RabbitMQ packet.\n    pub fn new() -\u003e Self {\n        // Get the RabbitMQ configuration\n        let config = match get_config() {\n            Ok(config) =\u003e config.rabbitmq.clone(),\n            Err(_) =\u003e RabbitMQConfig {\n                r_server_port: \"amqp://guest:guest@localhost:5672/\".to_string(),\n            },\n        };\n\n        Self {\n            connection: Mutex::new(None),\n            channel: Mutex::new(None),\n            consumers: RwLock::new(HashMap::new()),\n            consumer_tasks: RwLock::new(HashMap::new()),\n            server: config.r_server_port.clone(),\n            config,\n            connected: Mutex::new(false),\n            exchange: \"hybridpipe\".to_string(),\n        }\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for Packet {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if already connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if *connected {\n                return Err(Error::AlreadyConnected);\n            }\n        }\n\n        // Connect to RabbitMQ\n        let connection = Connection::connect(\n            \u0026self.server,\n            ConnectionProperties::default().with_connection_name(\"hybridpipe\".into()),\n        )\n        .await\n        .map_err(|e| Error::ConnectionError(format!(\"Failed to connect to RabbitMQ: {}\", e)))?;\n\n        // Create a channel\n        let channel = connection.create_channel().await.map_err(|e| {\n            Error::ConnectionError(format!(\"Failed to create RabbitMQ channel: {}\", e))\n        })?;\n\n        // Declare the exchange\n        channel\n            .exchange_declare(\n                \u0026self.exchange,\n                ExchangeKind::Topic,\n                ExchangeDeclareOptions {\n                    durable: true,\n                    auto_delete: false,\n                    ..Default::default()\n                },\n                FieldTable::default(),\n            )\n            .await\n            .map_err(|e| {\n                Error::ConnectionError(format!(\"Failed to declare RabbitMQ exchange: {}\", e))\n            })?;\n\n        // Store the connection and channel\n        let mut connection_guard = self.connection.lock().unwrap();\n        *connection_guard = Some(connection);\n        drop(connection_guard);\n\n        let mut channel_guard = self.channel.lock().unwrap();\n        *channel_guard = Some(channel);\n        drop(channel_guard);\n\n        // Set connected flag\n        {\n            let mut connected = self.connected.lock().unwrap();\n            *connected = true;\n        }\n\n        info!(\"Connected to RabbitMQ server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if connected and set flag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Cancel all consumer tasks\n        let mut consumer_tasks = self.consumer_tasks.write().await;\n        for (pipe, task) in consumer_tasks.drain() {\n            task.abort();\n            debug!(\"Cancelled consumer task for pipe: {}\", pipe);\n        }\n\n        // Clear the consumers\n        let mut consumers = self.consumers.write().await;\n        consumers.clear();\n\n        // Get the channel to close\n        let channel_to_close = {\n            let mut channel_guard = self.channel.lock().unwrap();\n            channel_guard.take()\n        };\n\n        // Close the channel if it exists\n        if let Some(channel) = channel_to_close {\n            if let Err(e) = channel.close(0, \"Normal shutdown\").await {\n                warn!(\"Error closing RabbitMQ channel: {}\", e);\n            }\n        }\n\n        // Get the connection to close\n        let connection_to_close = {\n            let mut connection_guard = self.connection.lock().unwrap();\n            connection_guard.take()\n        };\n\n        // Close the connection if it exists\n        if let Some(connection) = connection_to_close {\n            if let Err(e) = connection.close(0, \"Normal shutdown\").await {\n                warn!(\"Error closing RabbitMQ connection: {}\", e);\n            }\n        }\n\n        info!(\"Disconnected from RabbitMQ server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Get the channel\n        let channel = {\n            let channel_guard = self.channel.lock().unwrap();\n            match channel_guard.as_ref() {\n                Some(channel) =\u003e channel.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Convert the data to a JSON string\n        let json_string = serde_json::to_string(\u0026format!(\"{:?}\", data))\n            .map_err(|e| Error::SerializationError(format!(\"Failed to encode message: {}\", e)))?;\n\n        // Convert the JSON string to bytes\n        let bytes = json_string.into_bytes();\n\n        // Publish the message\n        channel\n            .basic_publish(\n                \u0026self.exchange,\n                pipe,\n                BasicPublishOptions::default(),\n                \u0026bytes.to_vec(),\n                BasicProperties::default(),\n            )\n            .await\n            .map_err(|e| Error::DispatchError(format!(\"Failed to publish message: {}\", e)))?;\n\n        Ok(())\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let consumers = self.consumers.read().await;\n        if consumers.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(consumers);\n\n        // Get the channel\n        let channel = {\n            let channel_guard = self.channel.lock().unwrap();\n            let channel = channel_guard.as_ref().ok_or(Error::NotConnected)?;\n            channel.clone()\n        };\n\n        // Declare a queue\n        let queue_name = format!(\"hybridpipe.{}\", pipe);\n        let queue = channel\n            .queue_declare(\n                \u0026queue_name,\n                QueueDeclareOptions {\n                    durable: true,\n                    auto_delete: false,\n                    ..Default::default()\n                },\n                FieldTable::default(),\n            )\n            .await\n            .map_err(|e| Error::SubscriptionError(format!(\"Failed to declare queue: {}\", e)))?;\n\n        // Bind the queue to the exchange\n        channel\n            .queue_bind(\n                \u0026queue_name,\n                \u0026self.exchange,\n                pipe,\n                QueueBindOptions::default(),\n                FieldTable::default(),\n            )\n            .await\n            .map_err(|e| Error::SubscriptionError(format!(\"Failed to bind queue: {}\", e)))?;\n\n        // Create a consumer\n        let mut consumer = channel\n            .basic_consume(\n                \u0026queue_name,\n                \u0026format!(\"hybridpipe-consumer-{}\", pipe),\n                BasicConsumeOptions::default(),\n                FieldTable::default(),\n            )\n            .await\n            .map_err(|e| Error::SubscriptionError(format!(\"Failed to create consumer: {}\", e)))?;\n\n        // Store the consumer\n        let mut consumers = self.consumers.write().await;\n        consumers.insert(pipe.to_string(), consumer.clone());\n        drop(consumers);\n\n        // Create a task to process messages\n        let pipe_owned = pipe.to_string();\n        let callback_owned = callback;\n        let task = tokio::spawn(async move {\n            info!(\"Started RabbitMQ consumer for pipe: {}\", pipe_owned);\n\n            while let Some(delivery) = consumer.next().await {\n                match delivery {\n                    Ok(delivery) =\u003e {\n                        if let Err(e) = callback_owned(delivery.data.clone()) {\n                            error!(\"Error processing message from pipe {}: {}\", pipe_owned, e);\n                        }\n\n                        // Acknowledge the message\n                        if let Err(e) = delivery.ack(BasicAckOptions::default()).await {\n                            error!(\"Failed to acknowledge message: {}\", e);\n                        }\n                    }\n                    Err(e) =\u003e {\n                        error!(\"Error receiving message from RabbitMQ: {}\", e);\n                    }\n                }\n            }\n        });\n\n        // Store the task\n        let mut consumer_tasks = self.consumer_tasks.write().await;\n        consumer_tasks.insert(pipe.to_string(), task);\n\n        info!(\"Subscribed to RabbitMQ routing key: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let consumers = self.consumers.read().await;\n        if !consumers.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(consumers);\n\n        // Cancel the consumer task\n        let mut consumer_tasks = self.consumer_tasks.write().await;\n        if let Some(task) = consumer_tasks.remove(pipe) {\n            task.abort();\n        }\n\n        // Remove the consumer\n        let mut consumers = self.consumers.write().await;\n        consumers.remove(pipe);\n\n        info!(\"Unsubscribed from RabbitMQ routing key: {}\", pipe);\n        Ok(())\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.disconnect().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        let connected = self.connected.lock().unwrap();\n        *connected\n    }\n}\n\n/// Register the RabbitMQ protocol with the HybridPipe system.\npub fn register() {\n    register_router_factory(BrokerType::RABBITMQ, Box::new(|| Arc::new(Packet::new())));\n} dConnection, AsyncCommands, Client,\n};\nuse std::any::Any;\nuse std::collections::HashMap;\nuse std::sync::{Arc, Mutex};\nuse tokio::sync::RwLock;\nuse tokio::task::JoinHandle;\n\nuse crate::core::config::{get_config, RedisConfig};\nuse crate::core::registry::register_router_factory;\nuse crate::core::{context, BrokerType, Error, HybridPipe, Process, Result};\n\n/// Packet implements the HybridPipe interface for Redis pub/sub.\npub struct Packet {\n    /// Client is the Redis client\n    client: Mutex\u003cOption\u003cClient\u003e\u003e,\n    /// Connection is the Redis connection for publishing\n    connection: Mutex\u003cOption\u003cMultiplexedConnection\u003e\u003e,\n    /// Subscriber tasks maps pipe names to their subscriber task handles\n    subscriber_tasks: RwLock\u003cHashMap\u003cString, JoinHandle\u003c()\u003e\u003e\u003e,\n    /// Server is the Redis server address with port\n    server: String,\n    /// Config holds the Redis configuration\n    config: RedisConfig,\n    /// Connected flag indicates if the packet is connected\n    connected: Mutex\u003cbool\u003e,\n}\n\nimpl Packet {\n    /// Create a new Redis packet.\n    pub fn new() -\u003e Self {\n        // Get the Redis configuration\n        let config = match get_config() {\n            Ok(config) =\u003e config.redis.clone(),\n            Err(_) =\u003e RedisConfig {\n                redis_address: \"localhost\".to_string(),\n            },\n        };\n\n        // Create the server address\n        let server = format!(\"redis://{}:{}\", config.redis_address, 6379);\n\n        Self {\n            client: Mutex::new(None),\n            connection: Mutex::new(None),\n            subscriber_tasks: RwLock::new(HashMap::new()),\n            server,\n            config,\n            connected: Mutex::new(false),\n        }\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for Packet {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if already connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if *connected {\n                return Err(Error::AlreadyConnected);\n            }\n        }\n\n        // Create Redis client\n        let client = Client::open(self.server.clone())\n            .map_err(|e| Error::ConnectionError(format!(\"Failed to create Redis client: {}\", e)))?;\n\n        // Create a multiplexed connection for publishing\n        let connection = client\n            .get_multiplexed_async_connection()\n            .await\n            .map_err(|e| Error::ConnectionError(format!(\"Failed to connect to Redis: {}\", e)))?;\n\n        // Store the client and connection\n        {\n            let mut client_guard = self.client.lock().unwrap();\n            *client_guard = Some(client);\n        }\n\n        {\n            let mut connection_guard = self.connection.lock().unwrap();\n            *connection_guard = Some(connection);\n        }\n\n        // Set connected flag\n        {\n            let mut connected = self.connected.lock().unwrap();\n            *connected = true;\n        }\n\n        info!(\"Connected to Redis server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if connected and set flag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Cancel all subscriber tasks\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        for (pipe, task) in subscriber_tasks.drain() {\n            task.abort();\n            debug!(\"Cancelled subscriber task for pipe: {}\", pipe);\n        }\n\n        // Clear the connection\n        {\n            let mut connection_guard = self.connection.lock().unwrap();\n            *connection_guard = None;\n        }\n\n        // Clear the client\n        {\n            let mut client_guard = self.client.lock().unwrap();\n            *client_guard = None;\n        }\n\n        info!(\"Disconnected from Redis server at {}\", self.server);\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Get the connection\n        let connection = {\n            let connection_guard = self.connection.lock().unwrap();\n            match connection_guard.as_ref() {\n                Some(conn) =\u003e conn.clone(),\n                None =\u003e return Err(Error::NotConnected),\n            }\n        };\n\n        // Convert the data to a JSON string\n        let json_string = serde_json::to_string(\u0026format!(\"{:?}\", data))\n            .map_err(|e| Error::SerializationError(format!(\"Failed to encode message: {}\", e)))?;\n\n        // Convert the JSON string to bytes\n        let bytes = json_string.into_bytes();\n\n        // Publish the message\n        // We need to use a mutable connection\n        let mut conn = connection;\n        conn.publish(pipe, bytes)\n            .await\n            .map_err(|e| Error::DispatchError(format!(\"Failed to publish message: {}\", e)))?;\n\n        Ok(())\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let subscriber_tasks = self.subscriber_tasks.read().await;\n        if subscriber_tasks.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(subscriber_tasks);\n\n        // Get the client\n        let client = {\n            let client_guard = self.client.lock().unwrap();\n            let client = client_guard.as_ref().ok_or(Error::NotConnected)?;\n            client.clone()\n        };\n\n        // Create a new connection for subscribing\n        let pubsub_conn = client.get_async_connection().await.map_err(|e| {\n            Error::SubscriptionError(format!(\"Failed to create Redis connection: {}\", e))\n        })?;\n\n        // Create a task to process messages\n        let pipe_owned = pipe.to_string();\n        let callback_owned = callback;\n        let task = tokio::spawn(async move {\n            info!(\"Started Redis subscriber for pipe: {}\", pipe_owned);\n\n            // Subscribe to the channel\n            let mut pubsub = pubsub_conn.into_pubsub();\n            if let Err(e) = pubsub.subscribe(\u0026pipe_owned).await {\n                error!(\"Failed to subscribe to Redis channel {}: {}\", pipe_owned, e);\n                return;\n            }\n\n            // Get a stream of messages\n            let mut stream = pubsub.on_message();\n\n            // Process messages\n            while let Some(msg) = stream.next().await {\n                let payload: Vec\u003cu8\u003e = match msg.get_payload() {\n                    Ok(payload) =\u003e payload,\n                    Err(e) =\u003e {\n                        error!(\"Failed to get payload from Redis message: {}\", e);\n                        continue;\n                    }\n                };\n\n                if let Err(e) = callback_owned(payload) {\n                    error!(\"Error processing message from pipe {}: {}\", pipe_owned, e);\n                }\n            }\n        });\n\n        // Store the task\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        subscriber_tasks.insert(pipe.to_string(), task);\n\n        info!(\"Subscribed to Redis channel: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let subscriber_tasks = self.subscriber_tasks.read().await;\n        if !subscriber_tasks.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(subscriber_tasks);\n\n        // Cancel the subscriber task\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        if let Some(task) = subscriber_tasks.remove(pipe) {\n            task.abort();\n        }\n\n        info!(\"Unsubscribed from Redis channel: {}\", pipe);\n        Ok(())\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.disconnect().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        let connected = self.connected.lock().unwrap();\n        *connected\n    }\n}\n\n/// Register the Redis protocol with the HybridPipe system.\npub fn register() {\n    register_router_factory(BrokerType::REDIS, Box::new(|| Arc::new(Packet::new())));\n}\n","traces":[{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0,"stats":{"Line":0}},{"line":49,"address":[],"length":0,"stats":{"Line":0}},{"line":52,"address":[],"length":0,"stats":{"Line":0}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":54,"address":[],"length":0,"stats":{"Line":0}},{"line":57,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":68,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":86,"address":[],"length":0,"stats":{"Line":0}},{"line":90,"address":[],"length":0,"stats":{"Line":0}},{"line":91,"address":[],"length":0,"stats":{"Line":0}},{"line":96,"address":[],"length":0,"stats":{"Line":0}},{"line":97,"address":[],"length":0,"stats":{"Line":0}},{"line":100,"address":[],"length":0,"stats":{"Line":0}},{"line":101,"address":[],"length":0,"stats":{"Line":0}},{"line":104,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":0}},{"line":108,"address":[],"length":0,"stats":{"Line":0}},{"line":109,"address":[],"length":0,"stats":{"Line":0}},{"line":111,"address":[],"length":0,"stats":{"Line":0}},{"line":115,"address":[],"length":0,"stats":{"Line":0}},{"line":116,"address":[],"length":0,"stats":{"Line":0}},{"line":117,"address":[],"length":0,"stat 81,"address":[],"length":0,"stats":{"Line":0}},{"line":282,"address":[],"length":0,"stats":{"Line":0}},{"line":283,"address":[],"length":0,"stats":{"Line":0}},{"line":286,"address":[],"length":0,"stats":{"Line":0}},{"line":287,"address":[],"length":0,"stats":{"Line":0}},{"line":290,"address":[],"length":0,"stats":{"Line":0}},{"line":291,"address":[],"length":0,"stats":{"Line":0}},{"line":294,"address":[],"length":0,"stats":{"Line":0}},{"line":295,"address":[],"length":0,"stats":{"Line":0}},{"line":296,"address":[],"length":0,"stats":{"Line":0}},{"line":301,"address":[],"length":0,"stats":{"Line":0}},{"line":302,"address":[],"length":0,"stats":{"Line":0}}],"covered":0,"coverable":117},{"path":["/","Users","anands","Programming","github.com","AnandSGit","hybridpipe.io","rust","src","protocols","tcp","mod.rs"],"content":"// TCP protocol implementation for HybridPipe\n//\n// This module provides an implementation of the HybridPipe interface for direct TCP communication.\n\nuse async_trait::async_trait;\nuse futures::sink::SinkExt;\nuse futures::stream::StreamExt;\nuse log::{debug, error, info};\nuse std::any::Any;\nuse std::collections::HashMap;\nuse std::net::SocketAddr;\nuse std::sync::{Arc, Mutex};\nuse tokio::io::{AsyncReadExt, AsyncWriteExt};\nuse tokio::net::{TcpListener, TcpStream};\nuse tokio::sync::{mpsc, RwLock};\nuse tokio::task::JoinHandle;\nuse tokio_util::codec::{Decoder, Framed, LengthDelimitedCodec};\n\nuse crate::core::config::{get_config, TCPConfig};\nuse crate::core::registry::register_router_factory;\nuse crate::core::{context, BrokerType, Error, HybridPipe, Process, Result};\n\n/// Packet implements the HybridPipe interface for direct TCP communication.\npub struct Packet {\n    /// Client connections maps pipe names to their TCP streams\n    client_connections: RwLock\u003cHashMap\u003cString, Framed\u003cTcpStream, LengthDelimitedCodec\u003e\u003e\u003e,\n    /// Server listener is the TCP listener for server mode\n    server_listener: Mutex\u003cOption\u003cTcpListener\u003e\u003e,\n    /// Server task is the task handling incoming connections in server mode\n    server_task: Mutex\u003cOption\u003cJoinHandle\u003c()\u003e\u003e\u003e,\n    /// Subscribers maps pipe names to their callback functions\n    subscribers: RwLock\u003cHashMap\u003cString, Process\u003e\u003e,\n    /// Subscriber tasks maps pipe names to their subscriber task handles\n    subscriber_tasks: RwLock\u003cHashMap\u003cString, JoinHandle\u003c()\u003e\u003e\u003e,\n    /// Config holds the TCP configuration\n    config: TCPConfig,\n    /// Connected flag indicates if the packet is connected\n    connected: Mutex\u003cbool\u003e,\n    /// Server mode flag indicates if the packet is in server mode\n    server_mode: bool,\n}\n\n/// TcpPacket is a version of Packet that uses Arc for all fields.\n/// This is used for spawning tasks that need to access the packet's fields.\nstruct TcpPacket {\n    /// Client connections maps pipe names to their TCP streams\n    client_connections: Arc\u003cRwLock\u003cHashMap\u003cString, Framed\u003cTcpStream, LengthDelimitedCodec\u003e\u003e\u003e\u003e,\n    /// Server listener is the TCP listener for server mode\n    server_listener: Arc\u003cMutex\u003cOption\u003cTcpListener\u003e\u003e\u003e,\n    /// Server task is the task handling incoming connections in server mode\n    server_task: Arc\u003cMutex\u003cOption\u003cJoinHandle\u003c()\u003e\u003e\u003e\u003e,\n    /// Subscribers maps pipe names to their callback functions\n    subscribers: Arc\u003cRwLock\u003cHashMap\u003cString, Process\u003e\u003e\u003e,\n    /// Subscriber tasks maps pipe names to their subscriber task handles\n    subscriber_tasks: Arc\u003cRwLock\u003cHashMap\u003cString, JoinHandle\u003c()\u003e\u003e\u003e\u003e,\n    /// Connected flag indicates if the packet is connected\n    connected: Arc\u003cMutex\u003cbool\u003e\u003e,\n    /// Server mode flag indicates if the packet is in server mode\n    server_mode: bool,\n}\n\nimpl Packet {\n    /// Create a new TCP packet.\n    pub fn new() -\u003e Self {\n        // Get the TCP configuration\n        let config = match get_config() {\n            Ok(config) =\u003e config.tcp.clone(),\n            Err(_) =\u003e TCPConfig {\n                tcp_host: \"localhost\".to_string(),\n            },\n        };\n\n        // Determine if we're in server mode\n        let server_mode = config.tcp_host == \"0.0.0.0\" || config.tcp_host == \"::\";\n\n        Self {\n            client_connections: RwLock::new(HashMap::new()),\n            server_listener: Mutex::new(None),\n            server_task: Mutex::new(None),\n            subscribers: RwLock::new(HashMap::new()),\n            subscriber_tasks: RwLock::new(HashMap::new()),\n            config,\n            connected: Mutex::new(false),\n            server_mode,\n        }\n    }\n}\n\n#[async_trait]\nimpl HybridPipe for Packet {\n    async fn connect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if already connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if *connected {\n                return Err(Error::AlreadyConnected);\n            }\n        }\n\n        if self.server_mode {\n            // Server mode: bind to a port and listen for connections\n            let addr = format!(\"{}:{}\", self.config.tcp_host, 9000)\n                .parse::\u003cSocketAddr\u003e()\n                .map_err(|e| Error::ConnectionError(format!(\"Invalid TCP address: {}\", e)))?;\n\n            let listener = TcpListener::bind(addr).await.map_err(|e| {\n                Error::ConnectionError(format!(\"Failed to bind TCP listener: {}\", e))\n            })?;\n\n            info!(\"TCP server listening on {}\", addr);\n\n            // Create a channel for new connections\n            let (tx, mut rx) =\n                mpsc::channel::\u003c(String, Framed\u003cTcpStream, LengthDelimitedCodec\u003e)\u003e(100);\n\n            // Create a task to handle incoming connections\n            // We can't clone RwLock directly, but we can use a reference to it\n            let subscribers = \u0026self.subscribers;\n\n            // Create a separate task for the listener\n            let listener_clone = listener;\n            let server_task = tokio::spawn(async move {\n                loop {\n                    match listener_clone.accept().await {\n                        Ok((stream, addr)) =\u003e {\n                            info!(\"New TCP connection from {}\", addr);\n\n                            // Set up framing\n                            let framed = LengthDelimitedCodec::new().framed(stream);\n\n                            // Create a unique pipe name for this connection\n                            let pipe = format!(\"tcp.{}\", addr);\n\n                            // Send the connection to the main task\n                            if let Err(e) = tx.send((pipe.clone(), framed)).await {\n                                error!(\"Failed to send new connection: {}\", e);\n                            }\n                        }\n                        Err(e) =\u003e {\n                            error!(\"Failed to accept TCP connection: {}\", e);\n                        }\n                    }\n                }\n            });\n\n            // Store the server task\n            let mut task_guard = self.server_task.lock().unwrap();\n            *task_guard = Some(server_task);\n            drop(task_guard);\n\n            // Create a task to process incoming connections\n            // We need to create a new TcpPacket to avoid capturing self\n            let tcp_packet = Arc::new(TcpPacket {\n                server_mode: self.server_mode,\n                connected: Arc::new(Mutex::new(*self.connected.lock().unwrap())),\n                subscribers: Arc::new(RwLock::new(HashMap::new())),\n                client_connections: Arc::new(RwLock::new(HashMap::new())),\n                server_listener: Arc::new(Mutex::new(None)),\n                server_task: Arc::new(Mutex::new(None)),\n                subscriber_tasks: Arc::new(RwLock::new(HashMap::new())),\n            });\n\n            tokio::spawn(async move {\n                while let Some((pipe, framed)) = rx.recv().await {\n                    // Store the connection\n                    let mut connections = tcp_packet.client_connections.write().await;\n                    connections.insert(pipe.clone(), framed);\n                    drop(connections);\n\n                    // Clone what we need for the new task\n                    let pipe_clone = pipe.clone();\n                    let tcp_packet_clone = Arc::clone(\u0026tcp_packet);\n\n                    // Spawn a new task to handle this connection\n                    tokio::spawn(async move {\n                        // Process messages from this connection\n                        let addr = match pipe_clone.parse::\u003cSocketAddr\u003e() {\n                            Ok(addr) =\u003e addr,\n                            Err(e) =\u003e {\n                                error!(\"Invalid address in pipe {}: {}\", pipe_clone, e);\n                                return;\n                            }\n                        };\n\n                        // Create a new connection to the address\n                        let addr = match pipe_clone.parse::\u003cSocketAddr\u003e() {\n                            Ok(addr) =\u003e addr,\n                            Err(e) =\u003e {\n                                error!(\"Invalid address in pipe {}: {}\", pipe_clone, e);\n                                return;\n                            }\n                        };\n\n                        let stream = match TcpStream::connect(addr).await {\n                            Ok(stream) =\u003e stream,\n                            Err(e) =\u003e {\n                                error!(\"Failed to connect to {}: {}\", addr, e);\n                                return;\n                            }\n                        };\n\n                        let mut framed = LengthDelimitedCodec::new().framed(stream);\n\n                        // Process messages\n                        while let Some(result) = framed.next().await {\n                            match result {\n                                Ok(bytes) =\u003e {\n                                    // Process the message\n                                    let subscribers = tcp_packet_clone.subscribers.read().await;\n                                    if let Some(callback) = subscribers.get(\u0026pipe_clone) {\n                                        if let Err(e) = callback(bytes.to_vec()) {\n                                            error!(\n                                                \"Error processing message from pipe {}: {}\",\n                                                pipe_clone, e\n                                            );\n                                        }\n                                    }\n                                }\n                                Err(e) =\u003e {\n                                    error!(\"Error reading from TCP connection: {}\", e);\n                                    break;\n                                }\n                            }\n                        }\n\n                        // Connection closed, remove it\n                        let mut connections = tcp_packet_clone.client_connections.write().await;\n                        connections.remove(\u0026pipe_clone);\n                        info!(\"TCP connection closed: {}\", pipe_clone);\n                    });\n                }\n            });\n        }\n\n        // Set connected flag\n        {\n            let mut connected = self.connected.lock().unwrap();\n            *connected = true;\n        }\n\n        info!(\n            \"TCP protocol initialized in {} mode\",\n            if self.server_mode { \"server\" } else { \"client\" }\n        );\n        Ok(())\n    }\n\n    async fn disconnect(\u0026self) -\u003e Result\u003c()\u003e {\n        // Check if connected and set flag to false\n        {\n            let mut connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n            *connected = false;\n        }\n\n        // Cancel all subscriber tasks\n        let mut subscriber_tasks = self.subscriber_tasks.write().await;\n        for (pipe, task) in subscriber_tasks.drain() {\n            task.abort();\n            debug!(\"Cancelled subscriber task for pipe: {}\", pipe);\n        }\n\n        // Cancel the server task if in server mode\n        if self.server_mode {\n            let mut task_guard = self.server_task.lock().unwrap();\n            if let Some(task) = task_guard.take() {\n                task.abort();\n            }\n\n            // Clear the server listener\n            let mut listener_guard = self.server_listener.lock().unwrap();\n            *listener_guard = None;\n        }\n\n        // Clear the client connections\n        let mut connections = self.client_connections.write().await;\n        connections.clear();\n\n        // Clear the subscribers\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.clear();\n\n        info!(\"TCP protocol disconnected\");\n        Ok(())\n    }\n\n    async fn dispatch(\u0026self, pipe: \u0026str, data: Box\u003cdyn Any + Send + Sync\u003e) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Convert the data to a JSON string\n        let json_string = serde_json::to_string(\u0026format!(\"{:?}\", data))\n            .map_err(|e| Error::SerializationError(format!(\"Failed to encode message: {}\", e)))?;\n\n        // Convert the JSON string to bytes\n        let bytes = json_string.into_bytes();\n\n        // Get the connection for this pipe\n        let mut connections = self.client_connections.write().await;\n\n        if self.server_mode {\n            // In server mode, we need to find the connection for this pipe\n            if let Some(framed) = connections.get_mut(pipe) {\n                framed\n                    .send(bytes.into())\n                    .await\n                    .map_err(|e| Error::DispatchError(format!(\"Failed to send message: {}\", e)))?;\n            } else {\n                return Err(Error::PipeNotFound(pipe.to_string()));\n            }\n        } else {\n            // In client mode, we need to create a connection if it doesn't exist\n            if !connections.contains_key(pipe) {\n                // Parse the address from the pipe name\n                let addr = pipe.parse::\u003cSocketAddr\u003e().map_err(|_| {\n                    Error::InvalidConfiguration(format!(\"Invalid TCP address in pipe: {}\", pipe))\n                })?;\n\n                // Connect to the server\n                let stream = TcpStream::connect(addr).await.map_err(|e| {\n                    Error::ConnectionError(format!(\"Failed to connect to TCP server: {}\", e))\n                })?;\n\n                // Set up framing\n                let framed = LengthDelimitedCodec::new().framed(stream);\n\n                // Store the connection\n                connections.insert(pipe.to_string(), framed);\n            }\n\n            // Send the message\n            if let Some(framed) = connections.get_mut(pipe) {\n                framed\n                    .send(bytes.into())\n                    .await\n                    .map_err(|e| Error::DispatchError(format!(\"Failed to send message: {}\", e)))?;\n            }\n        }\n\n        Ok(())\n    }\n\n    async fn dispatch_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        data: Box\u003cdyn Any + Send + Sync\u003e,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the dispatch with a timeout\n        ctx.run(self.dispatch(pipe, data)).await\n    }\n\n    async fn subscribe(\u0026self, pipe: \u0026str, callback: Process) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if already subscribed\n        let subscribers = self.subscribers.read().await;\n        if subscribers.contains_key(pipe) {\n            return Err(Error::AlreadySubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Store the callback\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.insert(pipe.to_string(), callback);\n\n        info!(\"Subscribed to TCP pipe: {}\", pipe);\n        Ok(())\n    }\n\n    async fn subscribe_with_context(\n        \u0026self,\n        ctx: \u0026context::Context,\n        pipe: \u0026str,\n        callback: Process,\n    ) -\u003e Result\u003c()\u003e {\n        // Use the context to run the subscribe with a timeout\n        ctx.run(self.subscribe(pipe, callback)).await\n    }\n\n    async fn remove(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        self.unsubscribe(pipe).await\n    }\n\n    async fn unsubscribe(\u0026self, pipe: \u0026str) -\u003e Result\u003c()\u003e {\n        // Check if connected\n        {\n            let connected = self.connected.lock().unwrap();\n            if !*connected {\n                return Err(Error::NotConnected);\n            }\n        }\n\n        // Check if subscribed\n        let subscribers = self.subscribers.read().await;\n        if !subscribers.contains_key(pipe) {\n            return Err(Error::NotSubscribed(pipe.to_string()));\n        }\n        drop(subscribers);\n\n        // Remove the subscriber\n        let mut subscribers = self.subscribers.write().await;\n        subscribers.remove(pipe);\n\n        info!(\"Unsubscribed from TCP pipe: {}\", pipe);\n        Ok(())\n    }\n\n    async fn close(\u0026self) -\u003e Result\u003c()\u003e {\n        self.disconnect().await\n    }\n\n    fn is_connected(\u0026self) -\u003e bool {\n        let connected = self.connected.lock().unwrap();\n        *connected\n    }\n}\n\n/// Register the TCP protocol with the HybridPipe system.\npub fn register() {\n    register_router_factory(BrokerType::TCP, Box::new(|| Arc::new(Packet::new())));\n}\n","traces":[{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":69,"address":[],"length":0,"stats":{"Line":0}},{"line":74,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length":0,"stats":{"Line":0}},{"line":78,"address":[],"length":0,"stats":{"Line":0}},{"line":79,"address":[],"length":0,"stats":{"Line":0}},{"line":80,"address":[],"length":0,"stats":{"Line":0}},{"line":81,"address":[],"length":0,"stats":{"Line":0}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":91,"address":[],"length":0,"stats":{"Line":0}},{"line":94,"address":[],"length":0,"stats":{"Line":0}},{"line":95,"address":[],"length":0,"stats":{"Line":0}},{"line":96,"address":[],"length":0,"stats":{"Line":0}},{"line":100,"address":[],"length":0,"stats":{"Line":0}},{"line":102,"address":[],"length":0,"stats":{"Line":0}},{"line":104,"address":[],"length":0,"stats":{"Line":0}},{"line":106,"address":[],"length":0,"stats":{"Line":0}},{"line":107,"address":[],"length":0,"stats":{"Line":0}},{"line":110,"address":[],"length":0,"stats":{"Line":0}},{"line":113,"address":[],"length":0,"stats":{"Line":0}},{"line":114,"address":[],"length":0,"stats":{"Line":0}},{"line":118,"address":[],"length":0 nables cross-language compatible serialization\n    pub cross_language_compatible: bool,\n    /// ProtobufMessageType specifies the Protocol Buffer message type name\n    pub protobuf_message_type: Option\u003cString\u003e,\n}\n\nimpl Default for SerializationOptions {\n    fn default() -\u003e Self {\n        Self {\n            format: SerializationFormat::Bincode,\n            compression: false,\n            compression_level: 6,\n            cross_language_compatible: false,\n            protobuf_message_type: None,\n        }\n    }\n}\n\n/// Header for serialized messages\n#[derive(Debug, Clone, Copy)]\nstruct MessageHeader {\n    /// Magic number to identify HybridPipe messages\n    magic: [u8; 2],\n    /// Version of the message format\n    version: u8,\n    /// Format used for serialization\n    format: u8,\n    /// Flags for additional options (e.g., compression)\n    flags: u8,\n    /// Reserved for future use\n    reserved: [u8; 3],\n    /// Length of the payload\n    payload_length: u32,\n    /// Checksum of the payload\n    checksum: u8,\n}\n\nconst HEADER_SIZE: usize = 12;\nconst MAGIC: [u8; 2] = [b'H', b'P'];\nconst VERSION: u8 = 1;\nconst COMPRESSION_FLAG: u8 = 0x01;\n\n/// Encode data using the default serialization options.\npub fn encode\u003cT: Serialize + 'static\u003e(data: \u0026T) -\u003e Result\u003cBytes\u003e {\n    encode_with_options(data, \u0026SerializationOptions::default())\n}\n\n/// Encode data using the specified serialization options.\npub fn encode_with_options\u003cT: Serialize + 'static\u003e(\n    data: \u0026T,\n    options: \u0026SerializationOptions,\n) -\u003e Result\u003cBytes\u003e {\n    // Serialize the data based on the format\n    let mut payload = match options.format {\n        SerializationFormat::Bincode =\u003e bincode::serialize(data)\n            .map_err(|e| Error::SerializationError(format!(\"bincode error: {}\", e)))?,\n        SerializationFormat::Json =\u003e serde_json::to_vec(data)\n            .map_err(|e| Error::SerializationError(format!(\"json error: {}\", e)))?,\n        SerializationFormat::MessagePack =\u003e rmp_serde::to_vec(data)\n            .map_err(|e| Error::SerializationError(format!(\"messagepack error: {}\", e)))?,\n        SerializationFormat::Protobuf =\u003e {\n            if let Some(type_name) = \u0026options.protobuf_message_type {\n                // Convert the result to Vec\u003cu8\u003e to match other branches\n                let bytes = protobuf::encode_protobuf_dynamic(data, type_name)\n                    .map_err(|e| Error::SerializationError(format!(\"protobuf error: {}\", e)))?;\n                bytes.to_vec()\n            } else {\n                return Err(Error::SerializationError(\n                    \"protobuf serialization requires a message type\".to_string(),\n                ));\n            }\n        }\n    };\n\n    // Compress the payload if requested\n    if options.compression {\n        let mut encoder = GzEncoder::new(Vec::new(), Compression::new(options.compression_level));\n        encoder\n            .write_all(\u0026payload)\n            .map_err(|e| Error::SerializationError(format!(\"compression error: {}\", e)))?;\n        payload = encoder\n            .finish()\n            .map_err(|e| Error::SerializationError(format!(\"compression finish error: {}\", e)))?;\n    }\n\n    // Create the header\n    let mut header = [0u8; HEADER_SIZE];\n\n    // Magic number\n    header[0] = MAGIC[0];\n    header[1] = MAGIC[1];\n\n    // Version\n    header[2] = VERSION;\n\n    // Format\n    header[3] = match options.format {\n        SerializationFormat::Bincode =\u003e 0,\n        SerializationFormat::Json =\u003e 1,\n        SerializationFormat::Protobuf =\u003e 2,\n        SerializationFormat::MessagePack =\u003e 3,\n    };\n\n    // Flags\n    let mut flags = 0u8;\n    if options.compression {\n        flags |= COMPRESSION_FLAG;\n    }\n    header[4] = flags;\n\n    // Reserved\n    // header[5..8] remains zero essagePack,\n            ..Default::default()\n        };\n        \n        let bincode_encoded = encode_with_options(\u0026message, \u0026bincode_options).expect(\"Failed to encode with bincode\");\n        let json_encoded = encode_with_options(\u0026message, \u0026json_options).expect(\"Failed to encode with JSON\");\n        let messagepack_encoded = encode_with_options(\u0026message, \u0026messagepack_options).expect(\"Failed to encode with MessagePack\");\n        \n        // Decode with format detection\n        let bincode_decoded: TestMessage = decode(\u0026bincode_encoded).expect(\"Failed to decode bincode\");\n        let json_decoded: TestMessage = decode(\u0026json_encoded).expect(\"Failed to decode JSON\");\n        let messagepack_decoded: TestMessage = decode(\u0026messagepack_encoded).expect(\"Failed to decode MessagePack\");\n        \n        // Check if the decoded messages match the original\n        assert_eq!(bincode_decoded, message);\n        assert_eq!(json_decoded, message);\n        assert_eq!(messagepack_decoded, message);\n    }\n\n    #[test]\n    fn test_cross_format_compatibility() {\n        let message = create_test_message();\n        \n        // Encode with bincode\n        let bincode_options = SerializationOptions {\n            format: SerializationFormat::Bincode,\n            ..Default::default()\n        };\n        let encoded = encode_with_options(\u0026message, \u0026bincode_options).expect(\"Failed to encode with bincode\");\n        \n        // Decode with explicit bincode options\n        let decoded: TestMessage = decode_with_options(\u0026encoded, \u0026bincode_options).expect(\"Failed to decode with bincode options\");\n        assert_eq!(decoded, message);\n        \n        // Decode with format detection\n        let auto_decoded: TestMessage = decode(\u0026encoded).expect(\"Failed to decode with auto detection\");\n        assert_eq!(auto_decoded, message);\n    }\n\n    #[test]\n    fn test_error_handling(
